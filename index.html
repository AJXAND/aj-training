<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script>(function(){try{var t=localStorage.getItem("ajtheme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="theme-color" content="#0C0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AJ Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>AJ Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: clean phone dashboard. White cards on a soft grey page, wide uppercase display headings, black pills for controls,
   orange for training data and the centre action button. Bottom nav with a raised + button. */
:root{
  --page:#F4F4F2; --card:#FFFFFF; --sunk:#EEEEEC; --ink:#0D0D0F; --muted:#8B8B93; --line:#E6E6E3;
  --orange:#FF6B1A; --orange-soft:#FFE6D6; --cardio:#3D7BFF; --weight:#8E6BFF; --bf:#F2B230; --good:#21A366; --warn:#E5484D;
  --pill:#0D0D0F; --pill-ink:#FFFFFF;
  --kcal:#0D0D0F; --prot:#FF5A36; --fat:#F2B230; --carb:#21A366;
  --display:"Archivo","Arial Black",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0C0C0E; --card:#18181B; --sunk:#232327; --ink:#F4F4F5; --muted:#8E8E96; --line:#2A2A2F;
  --orange:#FF7A2E; --orange-soft:#3A2214; --cardio:#5B90FF; --weight:#A18AFF; --bf:#F5C04F; --good:#34C27E; --warn:#FF6B6F;
  --pill:#F4F4F5; --pill-ink:#0C0C0E; --kcal:#F4F4F5; --prot:#FF7051; --fat:#F5C04F; --carb:#34C27E; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0C0C0E; --card:#18181B; --sunk:#232327; --ink:#F4F4F5; --muted:#8E8E96; --line:#2A2A2F;
  --orange:#FF7A2E; --orange-soft:#3A2214; --cardio:#5B90FF; --weight:#A18AFF; --bf:#F5C04F; --good:#34C27E; --warn:#FF6B6F;
  --pill:#F4F4F5; --pill-ink:#0C0C0E; --kcal:#F4F4F5; --prot:#FF7051; --fat:#F5C04F; --carb:#34C27E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page)}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--navh) + 130px)}
main{display:grid;gap:16px}
main > *{min-width:0}
.spread .seg{width:auto;flex:none}
p{margin:0}
.date{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.01em;margin:4px 0 0;text-transform:uppercase;text-wrap:balance}
h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
h3{font-size:17px;font-weight:700;margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:20px;padding:18px;display:grid;gap:14px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.stack{display:grid;gap:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sync{font-size:12px;color:var(--muted);text-align:right;padding-bottom:4px}

/* pills, dropdowns, buttons */
.pills{display:flex;gap:8px;flex-wrap:wrap}
.dd{position:relative;display:inline-flex;align-items:center;background:var(--sunk);border-radius:999px;min-width:0}
.dd select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:600 15px var(--body);color:var(--ink);padding:10px 36px 10px 16px;border-radius:999px;cursor:pointer;min-width:0;max-width:100%}
.dd::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.dd.full{display:flex;width:100%}.dd.full select{width:100%}
.tgl{display:inline-flex;align-items:center;gap:8px;background:var(--sunk);border-radius:999px;padding:10px 16px;font:600 15px var(--body);border:0;color:var(--ink);cursor:pointer}
.tgl[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
.seg{display:grid;grid-auto-flow:column;background:var(--sunk);border-radius:999px;padding:4px;gap:2px;width:100%}
.seg button{font:600 14px var(--body);border:0;background:transparent;color:var(--muted);padding:9px 6px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 14px var(--body);border:0;background:var(--sunk);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
.btn{font:700 16px var(--body);border:0;border-radius:999px;padding:15px 18px;cursor:pointer;background:var(--pill);color:var(--pill-ink);width:100%}
.btn.orange{background:var(--orange);color:#fff}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.small{padding:9px 14px;font-size:14px;width:auto}
.btn.danger{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.btn[disabled]{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font:600 14px var(--body);cursor:pointer;padding:2px 0}
.link.muted{color:var(--muted)}
input,select,textarea{font:500 16px var(--body);color:var(--ink)}
input.field,textarea.field{padding:12px 14px;border-radius:14px;border:0;background:var(--sunk);width:100%;min-width:0}
input[type="date"].field,input[type="time"].field{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:46px;text-align:left;line-height:1.3}
input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value{text-align:left}
label.lab{min-width:0}
textarea.field{resize:vertical;min-height:44px;font-size:15px}
label.lab{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* tags + state */
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.tag.up{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.tag.rep{background:var(--orange-soft);color:var(--orange)}
.tag.hold{background:var(--sunk);color:var(--ink)}
.tag.flag{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.tag.note{background:transparent;color:var(--muted);padding-inline:0}
.banner{border-radius:16px;padding:12px 14px;font-size:14px;background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.banner b{color:var(--warn)}
.banner.info{background:var(--orange-soft)}
.banner.info b{color:var(--orange)}
.empty{text-align:center;padding:12px;color:var(--muted);font-size:15px}

/* weekly dashboard grid */
.wk{display:grid;grid-template-columns:repeat(7,1fr) 86px;column-gap:4px;align-items:center}
.wk .col{display:contents}
.wk .cell{height:48px;display:flex;justify-content:center;align-items:flex-end;padding-block:6px;border-bottom:1px solid var(--line);position:relative}
.wk .cell .b{width:9px;border-radius:5px;background:var(--sunk);height:100%;position:relative;overflow:hidden}
.wk .cell .b i{position:absolute;left:0;right:0;bottom:0;border-radius:5px}
.wk .cell .b.none{background:transparent;border:1.5px dashed var(--line)}
.wk .tot{grid-column:8;padding-left:10px;border-bottom:1px solid var(--line);height:48px;display:flex;flex-direction:column;justify-content:center}
.wk .tot b{font-size:17px;font-weight:700;line-height:1.1}
.wk .tot span{font-size:12px;color:var(--muted)}
.wk .dlab{text-align:center;font-size:13px;color:var(--muted);padding-top:8px;font-weight:600;cursor:pointer;background:none;border:0;font-family:var(--body)}
.wk .dlab.sel{color:var(--ink)}
.wk .hl{border:2px solid var(--ink);border-radius:12px;pointer-events:none;align-self:stretch;margin:-4px -1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:20px;padding:16px;display:grid;gap:4px;align-content:start;min-width:0;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.tile h3{font-size:16px}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.tile svg{width:100%;height:42px;margin-top:6px}
.daydetail{font-size:14px;display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted)}
.daydetail b{color:var(--ink)}

/* target muscle tiles + exercise list */
.mus{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mus div{border:1.5px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:2px}
.mus b{font-size:15px}
.mus span{font-size:13px;color:var(--muted)}
.exlist{display:grid}
.exi{display:grid;grid-template-columns:40px 1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.exi:first-child{border-top:0;padding-top:0}
.exi .ic{width:40px;height:40px;border-radius:12px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font:800 13px var(--display)}
.exi .nm{font-weight:600;min-width:0}
.exi .tg{font-family:var(--display);font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
.exi .sub{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

/* live workout */
.livehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.clock{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--orange);border-radius:3px}
.excard{background:var(--card);border-radius:20px;padding:16px;display:grid;gap:10px}
.excard.done{box-shadow:inset 0 0 0 2px var(--good)}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exhead .t{font-size:18px;font-weight:700;line-height:1.2}
.exhead .r{font-size:13px;color:var(--muted);white-space:nowrap}
.sets{display:grid;gap:6px}
.sethdr,.set{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center}
.sethdr{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.set .n{width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:700}
.set .n.drop{background:var(--orange-soft);color:var(--orange);font-size:10px}
.set input{font:700 18px var(--body);font-variant-numeric:tabular-nums;padding:10px 12px;border-radius:12px;border:0;background:var(--sunk);width:100%;min-width:0}
.set input::placeholder{color:var(--muted);opacity:.8;font-weight:500}
.tick{height:44px;border-radius:12px;border:0;background:var(--sunk);color:var(--muted);font-size:20px;cursor:pointer}
.set.ok .tick{background:var(--good);color:#fff}
.set.ok .n{background:var(--good);color:#fff}
.set.ok input{background:transparent}
.set.dropset{padding-left:14px}
.exfoot{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);align-items:center;flex-wrap:wrap}
.lastnote{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:8px 10px}

/* week list */
.wday{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;border:0}
.wday.is-today{box-shadow:inset 0 0 0 2px var(--ink)}
.wday .d{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--sunk);font-weight:700;line-height:1.05;font-size:13px;text-align:center}
.wday .d b{font-family:var(--display);font-size:16px}
.wday .f{min-width:0}.wday .f b{display:block}.wday .f span{font-size:13px;color:var(--muted)}
.status{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.status.done{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.status.next{background:var(--orange);color:#fff}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:92px 1fr 48px;gap:10px;align-items:center;font-size:14px}
.bar-row .track{height:8px;background:var(--sunk);border-radius:4px;position:relative;overflow:hidden}
.bar-row .track b{position:absolute;inset:0 auto 0 0;background:var(--orange);border-radius:4px}
.bar-row span:last-child{text-align:right}

/* stats, charts, photos, history */
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{display:grid;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumbs figure{margin:0;display:grid;gap:4px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--sunk);max-width:100%}
.thumbs figcaption{font-size:12px;color:var(--muted);text-align:center}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;cursor:pointer;background:none;border:0;text-align:left;color:inherit;font:inherit;padding:0;width:100%}
.kv{font-size:14px;display:grid;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.kv > div{display:grid;grid-template-columns:1fr auto;gap:10px}
.kv .note{grid-template-columns:1fr;color:var(--muted);font-size:13px}
.list{display:grid}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li .sub{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh);align-items:center}
.nav button{background:none;border:0;color:var(--muted);font:600 11px var(--body);display:grid;place-items:center;gap:3px;cursor:pointer;position:relative;padding:0}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--ink)}
.nav .plus{width:52px;height:52px;border-radius:50%;background:var(--orange);color:#fff;margin:0 auto;box-shadow:0 6px 16px color-mix(in srgb,var(--orange) 40%,transparent)}
.nav .plus svg{width:26px;height:26px;stroke-width:2.4}
.nav .plus.live{background:var(--ink);color:var(--card)}
.nav .dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--orange)}

/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:7;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:10px}
.timer .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--pill);color:var(--pill-ink);border-radius:20px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.timer .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.timer .lab{font-size:13px;opacity:.7}
.timer .bar{grid-column:1/-1;height:4px;background:color-mix(in srgb,var(--pill-ink) 20%,transparent);border-radius:2px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--orange);width:0}
.timer .ctl{display:flex;gap:6px}
.timer .ctl button{font:700 14px var(--body);background:color-mix(in srgb,var(--pill-ink) 14%,transparent);color:var(--pill-ink);border:0;border-radius:999px;padding:9px 12px;cursor:pointer}
.timer.over .big{color:var(--orange)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actions .in{max-width:540px;margin:0 auto;display:grid;gap:8px}
.actions .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.act{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;background:var(--sunk);border:0;border-radius:16px;padding:12px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.act .ai{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff}
.act .ai svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act b{display:block}.act span{font-size:13px;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:20;background:var(--page);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .top,.sheet .bottom,.sheet .msgs{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .top{display:flex;justify-content:space-between;align-items:center;padding-block:14px}
.sheet .msgs{overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-block:8px 14px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--pill);color:var(--pill-ink)}
.msg.ai{align-self:flex-start;background:var(--card)}
.msg.sys{align-self:center;font-size:13px;color:var(--muted);background:none;padding:2px;text-align:center}
.sheet .bottom{display:flex;gap:8px;padding-block:10px}
.sheet .bottom input{flex:1;padding:13px 16px;border-radius:999px;border:0;background:var(--card)}
.sheet .bottom .btn{width:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 96px + env(safe-area-inset-bottom,0px));background:var(--pill);color:var(--pill-ink);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;max-width:90vw;text-align:center}

/* v3 additions */
h1{margin-top:2px}
.top{align-items:center}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{border-radius:9px;flex:none;display:block}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.flip svg{transform:scaleX(-1)} .iconbtn[disabled]{opacity:.35}
.iconbtn.sq,.coachbtn.sq{width:46px;height:46px;border-radius:14px}
.coachbtn{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#FF9A3D,#FF6B1A 55%,#C2410C);box-shadow:0 4px 12px color-mix(in srgb,var(--orange) 35%,transparent);flex:none}
.coachbtn svg{width:20px;height:20px;fill:currentColor;stroke:none}
.tgl svg,.btn svg{width:18px;height:18px;vertical-align:-3px;fill:currentColor;stroke:currentColor;stroke-width:0}
.btn.ghost svg{fill:none;stroke-width:2}
h2.sect{margin-top:4px}
.warn{color:var(--warn)} .good{color:var(--good)}
.card.hero{background:linear-gradient(160deg,var(--card) 60%,var(--orange-soft))}
.tilecard{border:0;text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.macros{display:grid;gap:12px}
.mb{display:grid;gap:6px}
.mbl{font-weight:600;font-size:14px}.mbl i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.mbt{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}.mbt i{display:block;height:100%;border-radius:4px}
.datenav{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:999px;padding:5px}
.datenav .iconbtn{background:var(--sunk);width:34px;height:34px}
.searchbar{display:flex;gap:8px;align-items:center}
.sb{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:0 16px;height:46px;min-width:0}
.sb svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.sb input{border:0;background:transparent;flex:1;min-width:0;font:500 16px var(--body);color:var(--ink);outline:none}
.actrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pillact{display:grid;justify-items:center;gap:6px;background:var(--card);border:0;border-radius:16px;padding:12px 4px;font:600 12px var(--body);color:var(--ink);cursor:pointer;text-align:center}
.pillact svg{width:22px;height:22px;stroke:var(--orange);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.flist{display:grid}
.fe{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.fe:first-child{border-top:0;padding-top:0}
.ft{font-size:12px;color:var(--muted);font-weight:600}
.fn{display:grid;min-width:0}.fn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fk{display:grid;justify-items:end}.fk b{font-size:16px}
.mini{font-size:11px;font-weight:700}.mini i{font-style:normal}
.btnli{border:0;background:none;text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.stat.four{grid-template-columns:repeat(4,1fr)}
input.field.big{font-size:22px;font-weight:700}
.foodsheet .in{gap:12px}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--orange-soft);border-top-color:var(--orange);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.switch{width:52px;height:32px;border-radius:999px;border:0;background:var(--sunk);position:relative;cursor:pointer;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s}
.switch[aria-checked="true"]{background:var(--orange)}.switch[aria-checked="true"] i{left:23px}
/* month calendar */
.mgrid{display:grid;grid-template-columns:30px repeat(7,1fr);gap:4px 2px;align-items:center}
.mh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.04em}
.mwk{font-size:10px;color:var(--muted);text-align:center;display:grid;line-height:1.2;align-self:stretch;align-content:center;border-radius:8px}
.mwk b{font-size:11px;color:var(--ink)} .mwk.dl{background:var(--orange-soft)} .mwk.dl span{color:var(--orange);font-weight:800}
.mday{display:grid;justify-items:center;gap:3px;padding:6px 0 7px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.mday.dl{background:color-mix(in srgb,var(--orange-soft) 55%,transparent)}
.mday .mn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600}
.mday.today .mn{background:var(--ink);color:var(--card)}
.mday.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.mday.out{opacity:.3}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;display:block}
.dot.lift{background:var(--orange)} .dot.plan{box-shadow:inset 0 0 0 1.5px var(--orange)} .dot.miss{background:var(--line)} .dot.cardio{background:var(--cardio)} .dot.food{background:var(--carb)}
.stat.tiles3{grid-template-columns:repeat(3,1fr);gap:10px}
.stat.tiles3 .card{padding:14px;gap:2px}
/* lifts list */
.llist{display:grid}
h3.grp{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
h3.grp:first-child{margin-top:0}
.lrow{display:grid;grid-template-columns:40px 1fr 96px;gap:12px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.lrow .ic{width:40px;height:40px;border-radius:12px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font:800 13px var(--display)}
.ln{display:grid;min-width:0}.ln b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt{display:grid;justify-items:end}.lt svg{width:96px;height:30px}
.coachcta{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.coachcta .coachbtn{width:44px;height:44px}
.coachcta b{display:block}
.thumbs.staged figure{gap:6px}
.thumbs.staged .dd select{padding:7px 26px 7px 10px;font-size:13px}
.thumbs.staged .dd::after{right:10px;width:6px;height:6px}
/* chat */
.sheet.chat{background:var(--page)}
.sheet.chat .top{border-bottom:1px solid var(--line)}
.chat .brand b{display:block;font-size:17px}.chat .brand span{font-size:12px;color:var(--muted)}
.chat .msgs{gap:14px}
.msg{max-width:88%;font-size:15.5px;line-height:1.5}
.msg.me{border-radius:20px 20px 6px 20px;padding:10px 15px}
.msg.ai{background:none;padding:0 2px;max-width:94%}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin:0}.msg.ai ul{margin:4px 0 8px;padding-left:20px}
.msg.ai .who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.msg.ai .who .logo{border-radius:6px}
.msg img.att{display:block;max-width:180px;border-radius:14px;margin-bottom:6px}
.acard{align-self:stretch;background:var(--card);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center}
.acard .ai{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.acard .ai svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acard b{display:block;font-size:15px}.acard span{font-size:13px;color:var(--muted)}
.acard.undone{opacity:.45}
.typing{display:flex;gap:4px;padding:6px 2px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:30px 10px 10px;color:var(--muted)}
.chat-empty h2{color:var(--ink);font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:22px}
.sugg{padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.sugg .chip{white-space:nowrap;background:var(--card)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--page)}
.composer textarea{flex:1;border:0;background:var(--card);border-radius:22px;padding:12px 16px;font:500 16px var(--body);color:var(--ink);resize:none;max-height:120px;min-width:0;outline:none}
.composer .iconbtn{width:44px;height:44px}
.sendbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--orange);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.sendbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sendbtn[disabled]{opacity:.4}
.attpreview{display:flex;align-items:center;gap:8px;padding:0 16px 6px;font-size:13px;color:var(--muted)}
.attpreview img{width:40px;height:40px;object-fit:cover;border-radius:10px}
.conds{display:grid;gap:10px}
.condrow{display:grid;gap:6px}
.conds .chip{padding:7px 12px;font-size:13px}
/* habits */
.hlist{display:grid;gap:12px}
.hrowx{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center}
.hic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.hic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hl2{display:grid;min-width:0}
.hstrip{display:grid;grid-template-columns:repeat(28,1fr);gap:3px}
.hd{display:block;aspect-ratio:1;border-radius:3px;background:var(--sunk);max-width:100%}
.hd.ok{background:var(--good)} .hd.bad{background:var(--warn)} .hd.now{box-shadow:0 0 0 1.5px var(--ink)}
.sbars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:130px;align-items:end;position:relative}
.sb2{display:grid;grid-template-rows:1fr 18px;height:100%;align-items:end;justify-items:center}
.sb2 i{display:block;width:70%;border-radius:4px 4px 2px 2px;min-height:2px}
.sb2 em{font-style:normal;font-size:11px;color:var(--muted);align-self:center}
.sline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}
.tundo{background:none;border:0;color:var(--orange);font:700 14px var(--body);margin-left:8px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.timer .bar i{transition:width .25s linear}.progress i{transition:width .3s ease}}

/* standalone: page reset and safe areas */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden;overflow-x:clip}
.wrap,main{overflow-x:clip}
input,select,textarea{font-size:max(16px,1em)}
.dd select{font-size:16px}
body{overscroll-behavior-y:none}
img{max-width:100%}
/* login */
.ajlogin{position:fixed;inset:0;z-index:60;background:var(--page);display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px))}
.ajlogin-in{width:100%;max-width:380px;display:grid;gap:14px;justify-items:center;text-align:center}
.ajlogin-in .logo{border-radius:18px}
.ajlogin-in h1{font-size:30px}
.ajlogin form{display:grid;gap:10px;width:100%}
/* live scanner */
.scanner{position:fixed;inset:0;z-index:70;background:#000;color:#fff}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-top{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;gap:12px;align-items:center;background:linear-gradient(#000a,#0000)}
.sc-x{width:42px;height:42px;border-radius:50%;border:0;background:#fff3;color:#fff;font-size:18px;cursor:pointer;flex:none}
.sc-seg{background:#fff2;flex:1}
.sc-seg button{color:#fffb}
.sc-seg button[aria-pressed="true"]{background:#fff;color:#000}
.sc-frame{position:absolute;left:12%;right:12%;top:28%;height:min(76vw,44%);border-radius:18px;box-shadow:0 0 0 9999px #0007;border:2.5px solid #fff;transition:all .25s}
.sc-frame.label{top:18%;height:56%}
.sc-frame.barcode::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--orange);box-shadow:0 0 12px var(--orange);opacity:.8}
.sc-frame.ready{border-color:var(--orange);box-shadow:0 0 0 9999px #0007,0 0 0 4px color-mix(in srgb,var(--orange) 45%,transparent)}
.sc-frame.hit{border-color:var(--good);box-shadow:0 0 0 9999px #0007,0 0 0 4px var(--good)}
.sc-bottom{position:absolute;left:0;right:0;bottom:0;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:12px;background:linear-gradient(#0000,#000b)}
.sc-hint{margin:0;font-weight:600;text-align:center}
.sc-ring{width:160px;height:4px;border-radius:2px;background:#fff3;overflow:hidden}
.sc-ring i{display:block;height:100%;width:0;background:var(--orange);transition:width .18s}
.sc-torch{flex:none;margin-left:auto;width:42px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);font-size:20px;cursor:pointer}.sc-torch.on{background:var(--orange)}
.sc-shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:var(--orange);cursor:pointer}

/* onboarding flows (programme builder + nutrition goal) */
.ob{position:fixed;inset:0;z-index:60;background:var(--page);display:flex;flex-direction:column;animation:obin .28s ease}
@keyframes obin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.obtop{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;max-width:560px;width:100%;margin:0 auto}
.obtop .iconbtn{flex:none}
.obprog{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.obprog i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.obbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 28px;max-width:560px;width:100%;margin:0 auto;display:grid;gap:14px;align-content:start}
.obtitle{font-size:30px;margin:6px 0 4px}
.oblead{font-size:17px;line-height:1.5}
.obnote{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.obh{margin-top:10px}
.obfoot{display:grid;grid-auto-flow:column;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;width:100%;margin:0 auto;background:linear-gradient(to top,var(--page) 75%,transparent)}
.obopts{display:grid;gap:10px}
.obopt{display:grid;gap:4px;text-align:left;background:var(--card);border:0;border-radius:18px;padding:16px 18px;font:inherit;color:inherit;cursor:pointer;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s,transform .1s}
.obopt:active{transform:scale(.985)}
.obopt b{font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.obopt span{font-size:14px;color:var(--muted);line-height:1.45}
.obopt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--orange);background:color-mix(in srgb,var(--orange) 6%,var(--card))}
.obseq{display:inline-block;margin-top:6px;font-family:var(--display);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.obpoints{display:grid;gap:14px;margin-top:6px}
.obpoints>div{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.obpoints i{width:34px;height:34px;border-radius:11px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font:800 15px var(--display);font-style:normal}
.obpoints span{display:grid;gap:2px}.obpoints em{font-style:normal;color:var(--muted);font-size:14px;line-height:1.45}
.obsrc{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--orange);font:600 13px var(--body);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.obsrc::before{content:"";width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;background:radial-gradient(circle at 50% 70%,currentColor 0 1.4px,transparent 1.6px),linear-gradient(currentColor,currentColor) 50% 3px/1.5px 4px no-repeat}
.obdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.obday{aspect-ratio:1/1.15;border:0;border-radius:14px;background:var(--card);font:700 14px var(--body);color:var(--ink);cursor:pointer}
.obday[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
.obslider{display:grid;gap:6px;position:relative}
.ob input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;position:relative;z-index:1}
.ob input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--sunk)}
.ob input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--sunk)}
.ob input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--card);margin-top:-11px;box-shadow:0 0 0 3px var(--orange),0 3px 10px rgba(0,0,0,.18)}
.ob input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--card);border:3px solid var(--orange)}
.obslider.rate input[type=range]::-webkit-slider-runnable-track{background:transparent}
.obslider.rate::before{content:"";position:absolute;left:0;right:0;top:14px;height:8px;border-radius:99px;background:var(--sunk)}
.obrec{position:absolute;top:14px;height:8px;border-radius:99px;background:color-mix(in srgb,var(--good) 55%,transparent);z-index:0}
.obgym{display:grid;gap:10px;background:var(--card);border-radius:18px;padding:14px 16px}
.obgym .spread{align-items:center}.obseg{width:auto;min-width:160px}
.obkit{background:var(--card);border-radius:18px;padding:14px 16px}
.obkit summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none}
.obkit summary::-webkit-details-marker{display:none}
.obkit summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none;margin-left:4px}
.obkit[open] summary::after{transform:rotate(225deg)}
.obkit summary span{margin-left:auto}
.obkit .chips{margin-top:12px}
.obkit .chip,.obbig .chip{font-size:14px}
.obbig{gap:10px}.obbig .chip{padding:12px 16px}
.lchip em,.tagin{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--good);margin-left:6px}
.lchip.love{background:var(--orange);color:#fff}.lchip.love em{color:#fff}
.lchip.ban{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);text-decoration:line-through}
.obrir{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:6px}
.obrir div{background:var(--card);border-radius:14px;padding:10px 6px;display:grid;gap:2px;text-align:center}
.obrir span{font-size:12px;color:var(--muted);font-weight:600}.obrir b{font-size:14px}
.obrir .dl{background:var(--orange-soft)}.obrir .dl b{color:var(--orange)}
.obbuild{display:grid;justify-items:center;gap:18px;padding-top:12vh;text-align:center}
.obspin{animation:obpulse 1.2s ease-in-out infinite}
@keyframes obpulse{50%{transform:scale(1.06) rotate(-4deg)}}
.obticks{display:grid;gap:10px;text-align:left;min-height:240px}
.obticks div{display:flex;gap:10px;align-items:center;font-weight:600;animation:obin .25s ease}
.obticks i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;background:var(--sunk);box-shadow:inset 0 0 0 2px var(--orange)}
.obticks .done i{background:var(--orange);box-shadow:none}
.obticks .done{color:var(--muted)}
.obsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.obsum div{background:var(--card);border-radius:16px;padding:12px;display:grid;gap:2px;min-width:0}
.obsum div.full{grid-column:1/-1}

const DEFAULT_PROGRAMME = {schema:2, name:"No plan yet", placeholder:true, startDate:"2026-01-05", deloadEvery:6, exercises:{},

const DEFAULT_PROFILE = {name:"", sex:null, birthDate:"1995-01-01", birthSet:false, heightCm:175, bfManual:null, phase:"maintain", phaseStart:"2026-01-01", fallbackKg:75, showSample:false, currency:"£",

const MODULES={training:["Gym training","Programmes, live workouts, progression"], endurance:["Running & endurance","Race plans from 5k to multi-day ultras"], nutrition:["Nutrition","Food logging, scanners, adaptive targets"], habits:["Habits","Steps, sleep, quitting things, anything daily"], body:["Body","Weight trend, photos, body fat"]};

const PHASES = {

};

/* Cardio METs: 2024 Adult Compendium of Physical Activities (code in brackets); padel derived from match VO2 data. */
const CARDIO = {
  walk:{n:"Walk",levels:{"Easy":[2.8,"17152"],"Moderate":[3.8,"17190"],"Brisk":[4.8,"17200"],"Very brisk":[5.5,"17220"],"Hilly":[5.3,"17082"],"Hike with pack":[7.8,"17012"]},def:"Moderate",dist:true},
  run:{n:"Run",levels:{"Easy":[9.0,"12045"],"Steady":[10.5,"12060"],"Tempo":[11.8,"12080"],"Hard":[12.5,"12100"],"Hills":[16.0,"12350"]},def:"Steady",dist:true},

  golf:{n:"Golf",levels:{"Walking, carrying":[4.3,"15265"],"Walking, trolley":[4.5,"15285"],"Buggy":[3.5,"15290"],"Driving range":[3.5,"15270"]},def:"Walking, trolley"},
  rugby:{n:"Rugby",levels:{"Match":[8.3,"15560"],"Touch":[6.3,"15562"]},def:"Touch"}

const RUN_TABLE = [[6.8,6.5],[7.7,7.8],[8.4,8.5],[9.3,9.0],[10.1,9.3],[10.8,10.5],[11.3,11.0],[12.1,11.8],[12.9,12.0],[13.8,12.5],[14.5,13.0],[16.1,14.8],[17.7,16.8],[19.3,18.5],[99,19.8]];

const CYCLE_TABLE = [[16,4.0],[19.3,6.8],[22.5,8.0],[25.7,10.0],[99,12.0]];

/* ---------- State ---------- */
const S = {tab:"home", homeDay:null, progSeg:"lifts", planView:"week", planMonth:null, planSel:null, planGym:{}, exView:null, exGym:"all",
  pick:null, gym:null, deload:false, active:null, confirm:null, ready:false, open:null, busy:null, dayView:null,
  all:{sessions:[], cardio:[], photosets:[], foodlog:{}, weights:[], foods:[], habits:{}}, habits:{}, habitDate:null, sessions:[], cardio:[], photosets:[], foodlog:{}, weights:[], foods:[],
  profile:{...DEFAULT_PROFILE}, prog:DEFAULT_PROGRAMME, cardioForm:{type:"walk", level:"Moderate", mins:"", km:"", date:null},
  foodDate:null, foodAdd:null, foodQuery:"", chat:[], staged:[], canImages:false, canTools:false, settings:false, prevTab:null};
let db=null, assets=null, sampler=null, downloads=null;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD = s => new Date(s+"T12:00");
const fmtT = s => { s=Math.max(0,Math.round(s)); const m=Math.floor(s/60); return m+":"+pad(s%60); };
const e1 = (w,r) => (+w)*(1+(+r)/30);
const fmtDate = ts => new Date(ts).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const fmtD = d => parseD(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const r1 = x => Math.round(x*10)/10;
const dayBy = k => S.prog.days.find(d => d.k===k);
const todayDay = () => S.prog.days.find(d => d.wd===new Date().getDay());
const exDef = (k, custom) => custom || S.prog.exercises[k] || {n:k.replace(/^x-/,"").replace(/-/g," "), lo:8, hi:12, rest:90, eq:"other", m:"Other"};

function age(){ const b=parseD(S.profile.birthDate), n=new Date(); let a=n.getFullYear()-b.getFullYear(); if (n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) a--; return a; }

/* ---------- Sample filter ---------- */
function derive(){
  const show = S.profile.showSample!==false;
  const keep = x => show || !x.sample;
  S.sessions = S.all.sessions.filter(keep).sort((a,b)=>b.ts-a.ts);
  S.cardio = S.all.cardio.filter(keep).sort((a,b)=>b.ts-a.ts);
  S.photosets = S.all.photosets.filter(keep).sort((a,b)=>b.ts-a.ts);
  S.weights = S.all.weights.filter(w => show || !w.s).sort((a,b)=>a.d<b.d?-1:1);
  S.foods = S.all.foods.filter(keep);
  S.habits = {}; for (const [d,h] of Object.entries(S.all.habits)) if (keep(h)) S.habits[d]=h;
  S.foodlog = {}; for (const [d,doc] of Object.entries(S.all.foodlog)) { const e=(doc.entries||[]).filter(keep); if (e.length) S.foodlog[d]={...doc, entries:e}; }
}

/* ---------- Storage (db with local fallback) ---------- */
const LS="ajlog2:";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(LS+k)); } catch(e){ return null; } };
const lsSet = (k,v) => { try { v==null ? localStorage.removeItem(LS+k) : localStorage.setItem(LS+k, JSON.stringify(v)); } catch(e){} };
const chains={};
function queue(key, fn){ chains[key]=(chains[key]||Promise.resolve()).then(fn).catch(e=>{ console.warn(e); toast(e&&e.code==="quota_exceeded"?"Storage is full. Export, then delete old entries.":"Couldn't save. Check your connection."); }); return chains[key]; }
function putDoc(col, id, data){ if (db) return queue(col+"/"+id, () => db.collection(col).doc(id).set(data)); const all=lsGet(col)||{}; all[id]=data; lsSet(col, all); }
function delDoc(col, id){ if (db) return queue(col+"/"+id, () => db.collection(col).doc(id).delete()); const all=lsGet(col)||{}; delete all[id]; lsSet(col, all); }
function upsert(list, item){ S.all[list] = [item, ...S.all[list].filter(x=>x.id!==item.id)]; derive(); }
function removeItem(list, id){ S.all[list] = S.all[list].filter(x=>x.id!==id); derive(); delDoc(list, id); }
let activeT=null;
function saveActive(now){
  clearTimeout(activeT);
  const run = () => { lsSet("active", S.active); if (db) queue("state/active", () => S.active ? db.doc("state/active").set({session:S.active}) : db.doc("state/active").delete()); };

}
function saveWeights(){ derive(); if (db) queue("state/bodyweight", () => db.doc("state/bodyweight").set({entries:S.all.weights})); else lsSet("weights", S.all.weights); }
function saveProfile(){ derive(); if (db) queue("meta/profile", () => db.doc("meta/profile").set(S.profile)); else lsSet("profile", S.profile); }
function saveFoodDay(date){ const doc=S.all.foodlog[date]||{date,entries:[]}; derive(); if (!doc.entries.length) return delDoc("foodlog",date); const out={schema:SCHEMA, date, entries:doc.entries}; if (doc.status) out.status=doc.status; putDoc("foodlog", date, out); }
function saveFood(f){ S.all.foods=[f, ...S.all.foods.filter(x=>x.id!==f.id)]; derive(); putDoc("foods", f.id, f); }
let chatT=null;
function saveChat(){ clearTimeout(chatT); chatT=setTimeout(()=>{ const m=S.chat.slice(-40); if (db) queue("state/chat",()=>db.doc("state/chat").set({messages:m})); else lsSet("chat", m); }, 400); }

/* ---------- Body numbers ---------- */
function avgWindow(endDate, days){
  const end=parseD(endDate), vals=S.weights.filter(e=>{ const dd=(end-parseD(e.d))/864e5; return dd>=0 && dd<days; }).map(e=>e.kg);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function currentKg(){ return avgWindow(ymd(new Date()),7) || (S.weights.length ? S.weights[S.weights.length-1].kg : S.profile.fallbackKg); }
function currentBf(){
  if (S.profile.bfManual) return {v:S.profile.bfManual, src:"set manually"};
  const p=S.photosets.find(x=>x.bf&&x.bf.point);
  if (p) return {v:p.bf.point, src:"photos "+fmtD(p.date)};
  return {v:15, src:"default until your first photo check-in"};
}
function rmr(){ const kg=currentKg(), bf=currentBf().v/100; return 370 + 21.6*kg*(1-bf); }   // Katch-McArdle, kcal/day
function cardioMet(type, level, mins, km){
  const c=CARDIO[type]||CARDIO.walk, lv=c.levels[level]?level:c.def; let [met,code]=c.levels[lv], how=lv;
  const kmh = km && mins ? (+km)/(+mins/60) : null;
  if (kmh && c.dist && !/Hill|pack/.test(lv)){ const tbl=type==="run"?RUN_TABLE:type==="walk"?WALK_TABLE:CYCLE_TABLE; met=tbl.find(([b])=>kmh<=b)[1]; code="by speed"; how=r1(kmh)+" km/h"; }
  return {met, code, how, kmh, level:lv};
}
function cardioKcal(met, mins, kg){ const gross=met*3.5*kg/200*mins; return {gross:Math.round(gross), net:Math.max(0,Math.round(gross-rmr()/1440*mins))}; }

/* ---------- Nutrition: expenditure ----------
   Two parts, blended:
   1. Starting model from your answers: RMR (Katch-McArdle) + daily life (job) + cycling commute + steps + lifting + cardio,
      then /0.9 for the thermic effect of food (~10% of intake).
   2. Measured from your data: over the last 28 days, using ONLY days marked as fully logged,
      base burn = average(intake - that day's activity) - (weight trend slope x energy per kg of tissue).
      The slope is a least-squares fit through every weigh-in in the window, so single noisy weigh-ins barely move it.
      Energy per kg follows Forbes/Hall: leaner people gain/lose a larger share of lean tissue, so each kg holds fewer kcal than 7,700.
   The measured part's weight grows with the number of logged days (about 50% at 7 days, 80% at 28), so it improves daily.
   Daily activity (steps, sessions, cardio) is added on top, so a tennis day or a 15k-step day is credited properly. */
function dayTotals(date){ const e=(S.foodlog[date]||{}).entries||[]; return e.reduce((a,x)=>({kcal:a.kcal+(+x.kcal||0),p:a.p+(+x.p||0),c:a.c+(+x.c||0),f:a.f+(+x.f||0),n:a.n+1}),{kcal:0,p:0,c:0,f:0,n:0}); }
const ACT_DEFAULT = {job:"desk", steps:9000, commute:0, set:false};
function act(){ return {...ACT_DEFAULT, ...(S.profile.activity||{})}; }
const JOB = {desk:["Desk job / mostly sitting",0.15], mixed:["On your feet some of the day",0.28], active:["On your feet most of the day",0.45]};
function stepKcal(steps, kg){ return Math.max(0, steps) * 0.00045 * kg; }                 // net ~0.04 kcal per step at 88 kg
function liftKcal(mins, kg){ return 3.5 * kg * mins / 60; }                                 // resistance training ~4.5 MET gross (2024 Compendium), net of resting
function dayActivity(date, kg){
  const a=act(), st=stepsTotal(date), steps=st!=null ? st : a.steps;
  const lift=S.sessions.filter(x=>x.date===date).reduce((t,x)=>t+liftKcal(+x.mins||60,kg),0);
  const cardio=S.cardio.filter(c=>c.date===date && !(a.commute>0 && c.type==="cycle" && c.level==="Commute")).reduce((t,c)=>t+(+c.net||0),0);
  return {steps:stepKcal(steps,kg), lift, cardio, total:stepKcal(steps,kg)+lift+cardio, stepsLogged:st!=null};
}
function energyPerKg(){
  const kg=currentKg(), fm=kg*currentBf().v/100, p=10.4/(10.4+fm);                     // Forbes: lean share of a weight change
  return Math.round(p*1816 + (1-p)*9441);                                                 // kcal per kg of lean / fat tissue (Hall 2008)
}
// Was this day fully logged? Explicit choice wins; otherwise a day under ~45% of your expected burn is treated as partial.
function dayCounted(date, priorKcal){
  const doc=S.foodlog[date]; if (!doc || !(doc.entries||[]).length) return {ok:false, why:"Not logged"};
  if (doc.status==="partial") return {ok:false, why:"Marked partial"};
  if (doc.status==="complete") return {ok:true};
  const k=dayTotals(date).kcal;
  return k >= (priorKcal||2400)*0.45 ? {ok:true, auto:true} : {ok:false, why:"Looks partial", auto:true};
}
function priorModel(kg){
  const a=act(), r=rmr(), life=r*JOB[a.job][1], commute=a.commute/7*6.8*kg/60*0.85;   // cycling commute ~6.8 MET, net
  const progDays=(S.prog.days||[]).filter(d=>!d.rest&&!d.optional).length;
  const lift=liftKcal(70,kg)*progDays/7, steps=stepKcal(a.steps,kg);
  const cardioWk=S.cardio.filter(c=>(Date.now()-parseD(c.date))/864e5<28 && !(a.commute>0 && c.type==="cycle" && c.level==="Commute")).reduce((t,c)=>t+(+c.net||0),0)/4;
  const cardio=cardioWk/7, active=steps+lift+cardio;
  const total=(r+life+commute+active)/0.9;
  return {total, base:(r+life+commute)/0.9, rmr:r, life, commute, steps, lift, cardio, tef:total*0.1, activeAvg:active};
}
function slopeKgPerDay(from, to){
  const pts=S.weights.filter(w=>w.d>=from&&w.d<=to).map(w=>[(parseD(w.d)-parseD(from))/864e5, +w.kg]);
  if (pts.length<4) return null;
  const span=pts[pts.length-1][0]-pts[0][0]; if (span<7) return null;
  const n=pts.length, mx=pts.reduce((a,p)=>a+p[0],0)/n, my=pts.reduce((a,p)=>a+p[1],0)/n;
  let sxy=0,sxx=0; pts.forEach(([x,y])=>{ sxy+=(x-mx)*(y-my); sxx+=(x-mx)**2; });
  const b=sxy/sxx, res=pts.reduce((a,[x,y])=>a+(y-(my+b*(x-mx)))**2,0), se=Math.sqrt(res/Math.max(1,n-2)/sxx);
  return {b, se, n, span};
}
function expenditure(endDate){
  const end=endDate||ymd(new Date()), kg=currentKg(), pm=priorModel(kg), prior=Math.round(pm.total/10)*10;
  let win=28, used=[], skipped=[];
  const collect=w=>{ used=[]; skipped=[]; for (let i=1;i<=w;i++){ const d=ymd(new Date(parseD(end)-i*864e5)); const c=dayCounted(d,pm.total); if (c.ok) used.push(d); else if (S.foodlog[d]) skipped.push({d,why:c.why}); } };
  collect(win); if (used.length<10){ win=42; collect(win); }
  const from=ymd(new Date(parseD(end)-win*864e5)), sl=slopeKgPerDay(from, ymd(new Date(parseD(end)-864e5)));
  const base={...pm, kcal:prior, prior, n:used.length, used, skipped, win, adaptive:false, ed:energyPerKg()};
  if (used.length<5 || !sl) return base;
  const ed=energyPerKg();
  const rows=used.map(d=>{ const t=dayTotals(d).kcal, a=dayActivity(d,kg).total; return {d, intake:t, act:a, net:t-a}; });
  const mean=rows.reduce((x,r)=>x+r.net,0)/rows.length, sd=Math.sqrt(rows.reduce((x,r)=>x+(r.net-mean)**2,0)/Math.max(1,rows.length-1));
  const measuredBase=mean - sl.b*ed;                                                   // burn excluding that day's activity
  const w=Math.min(0.9, rows.length/(rows.length+7));
  const blendedBase=w*measuredBase + (1-w)*(pm.total-pm.activeAvg);
  let actAvg=0; for (let i=1;i<=28;i++) actAvg+=dayActivity(ymd(new Date(parseD(end)-i*864e5)),kg).total; actAvg/=28;
  const kcal=Math.round((blendedBase+actAvg)/10)*10;
  const err=Math.round(Math.sqrt((sd/Math.sqrt(rows.length))**2 + (sl.se*ed)**2) * (1-w*0.3) / 10)*10;
  return {...base, kcal, adaptive:true, measuredBase:Math.round(measuredBase), blendedBase:Math.round(blendedBase), actAvg:Math.round(actAvg), w, err,
    intake:Math.round(rows.reduce((x,r)=>x+r.intake,0)/rows.length), change:sl.b*7, weighins:sl.n, ed};
}
function expenditureToday(){ const ex=expenditure(), kg=currentKg(), a=dayActivity(ymd(new Date()),kg); return {...ex, today:Math.round((ex.kcal-(ex.actAvg??ex.activeAvg)+a.total)/10)*10, actToday:a}; }
function targets(date){
  const n=S.profile.nutrition||{}, ph=PHASES[S.profile.phase], kg=currentKg(), ex=expenditure();
  if (n.mode==="manual" && n.kcal) return {kcal:+n.kcal, p:+n.p||0, f:+n.f||0, c:+n.c||0, mode:"manual", ex};
  if (S.profile.goal && window.AJGoal) return AJGoal.targets(date);
  const kcal=Math.round(ex.kcal*ph.kcalAdj/10)*10, p=Math.round(kg*ph.prot), f=Math.round(Math.max(kg*0.9, kcal*0.25/9)), c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  return {kcal,p,f,c,mode:"auto",ex};
}

/* ---------- Progression engine (gym aware) ---------- */
function liftHistory(k, includeDeload, gym){
  const out=[];
  for (const s of S.sessions){
    if (s.deload && !includeDeload) continue;
    if (gym && gym!=="all" && s.gym!==gym) continue;
    const e=(s.ex||[]).find(x=>x.k===k);
    if (e && e.sets && e.sets.length) out.push({ts:s.ts, date:s.date, sets:e.sets, note:e.note, gym:s.gym, deload:s.deload, id:s.id});
  }
  return out;
}
function incFor(eq){ return eq==="bb" ? 2.5 : null; }
function advice(k, custom, gym){
  const ex=exDef(k, custom), phase=S.profile.phase;
  let h=liftHistory(k,false,gym), cross=false;
  if (!h.length && gym){ h=liftHistory(k,false); cross=h.length>0; }
  if (!h.length) return {status:"new", pill:`<span class="tag">New: find a ${ex.lo}–${ex.hi} rep weight</span>`, last:null};
  const f=h[0].sets[0], w=+f.w, r=+f.r, inc=incFor(ex.eq);
  if (cross) return {status:"cross", pill:`<span class="tag">First time at ${esc(gymName(gym))}: stacks differ, aim ${ex.lo}–${ex.hi}</span>`, last:h[0], tw:"", tr:"", cross:true};
  const topHit=r>=ex.hi, prevTop=h[1] && +h[1].sets[0].w===w && +h[1].sets[0].r>=ex.hi;
  const addLoad=(phase==="recomp"||phase==="maintain") ? (topHit&&prevTop) : topHit;
  let pill, tw=w, tr=r, status;
  if (addLoad){ status="up"; tw=inc?w+inc:w; tr=ex.lo; pill=`<span class="tag up">Add load: ${inc?(w+inc)+" kg":"next weight up"}, aim ${ex.lo}+</span>`; }
  else if (topHit){ status="hold"; pill=`<span class="tag hold">Top once: repeat ${w} × ${ex.hi}+</span>`; }
  else if (r<ex.lo){ if (phase==="cut"){ status="drop"; tw=Math.round(w*0.95/2.5)*2.5; pill=`<span class="tag flag">Below range: ~${tw} kg</span>`; } else { status="reps"; pill=`<span class="tag rep">Hold ${w} kg, get to ${ex.lo}</span>`; } }
  else if (phase==="cut"){ status="hold"; pill=`<span class="tag hold">Hold: match ${w} × ${r}</span>`; }
  else { status="reps"; tr=r+1; pill=`<span class="tag rep">Beat it: ${w} × ${r+1}</span>`; }
  let flag="";
  const es=h.slice(0,4).map(x=>e1(x.sets[0].w,x.sets[0].r));
  if (phase==="cut"){ if (es.length>=2 && es[0]<0.95*Math.max(...es)) flag="Down 5%+ from recent best"; }
  else { if (es.length>=3 && es[0]<es[1] && es[1]<es[2]) flag="Down two sessions running"; else if (phase==="bulk" && es.length>=4 && Math.max(es[0],es[1],es[2])<=es[3]) flag="No progress in 3 sessions"; }
  if (flag) pill+=` <span class="tag flag">${flag}</span>`;
  return {status, pill, last:h[0], tw, tr, flag};
}
function blockWeek(ts){ const start=parseD(S.prog.startDate||ymd(new Date())).getTime(); return Math.floor((ts-weekStart(new Date(start)).getTime())/(7*864e5)); }
function deloadStatus(){
  if (!S.sessions.length) return null;
  const lastD=S.sessions.find(s=>s.deload), start=lastD?lastD.ts:Math.min(...S.sessions.map(s=>s.ts));
  return {weeks:Math.floor((Date.now()-weekStart(new Date(start)).getTime())/(7*864e5))+1, every:S.prog.deloadEvery||6, hasDeload:!!lastD};
}

}
function macroBar(label, val, target, color, unit, remaining){
  const pct=target?Math.min(100,val/target*100):0, over=target&&val>target;
  const big = remaining ? fmtN(target-val) : fmtN(val);
  return `<div class="mb"><div class="spread"><span class="mbl"><i style="background:${color}"></i>${label}</span><span class="num"><b${over&&!remaining?' style="color:var(--warn)"':""}>${big}${unit}</b> <span class="muted small">${remaining?"left":"of "+fmtN(target)+unit}</span></span></div><div class="mbt"><i style="width:${pct}%;background:${color}"></i></div></div>`;
}

    case "hStartQuit": { const list=habitList().map(x=>x.id===h.id?{...x, quitDate:ymd(new Date())}:x); saveHabitList(list); render(); toast("Day 1. You've got this."); return true; }

    case "hSlip": { if (S.confirm!=="slip-"+h.id){ S.confirm="slip-"+h.id; render(); return true; } S.confirm=null; const v={used:0,cravings:[],...(hval(h,date)||{})}; v.used=(v.used||0)+1; hset(h,date,v); render(); toast("Logged. One slip doesn't undo your progress."); return true; }

  }

}

/* Food database: USDA FoodData Central SR Legacy (public domain), via the TempoLife dataset (CC-BY-4.0). Loaded on first search. */
let FOODDB, FOODIDX;
async function loadFoodDb(){
  FOODDB=null;
  try{ const r=await fetch("foods-db.json"); FOODDB=await r.json(); FOODIDX=FOODDB.map(x=>x[0].toLowerCase()); }
  catch(e){ FOODDB=[]; FOODIDX=[]; console.warn("food db",e); }
  if (S.tab==="food"){ const el=$("#foodQ"), pos=el?el.selectionStart:0; render(); const n=$("#foodQ"); if(n&&el===document.activeElement||n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } }
}
const FOOD_SYN={espresso:"espresso",coffee:"coffee",chips:"potatoes, french fried",crisps:"potato chips",mince:"ground",courgette:"zucchini",aubergine:"eggplant",prawns:"shrimp",porridge:"oats",biscuit:"cookies",coriander:"cilantro",rocket:"arugula",jam:"jams",yoghurt:"yogurt",skimmed:"nonfat",semi:"2%"};
function prettyName(n){ return n.replace(/^(Beverages|Cereals ready-to-eat|Snacks|Fast foods|Restaurant|Candies|Spices|Soup|Sauce|Fish|Beef|Pork|Lamb|Chicken|Veal|Game meat),\s*/i,(m,g)=>/^(Fish|Beef|Pork|Lamb|Chicken|Veal)$/i.test(g)?g+", ":"").replace(/\b([A-Z]{3,})\b/g,w=>w[0]+w.slice(1).toLowerCase()); }
function searchDb(q, max){
  if (!FOODDB||!FOODDB.length) return [];
  const words=q.toLowerCase().split(/[\s,]+/).filter(Boolean).map(w=>FOOD_SYN[w]||w).map(w=>w.length>3&&/[^s]s$/.test(w)?w.slice(0,-1):w);
  const res=words.map(w=>new RegExp("(^|[^a-z])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(s|es)?([^a-z]|$)"));
  const hits=[], seen=new Set();
  for (let i=0;i<FOODIDX.length;i++){
    const n=FOODIDX[i]; if (seen.has(n) || !res.every(r=>r.test(n))) continue; seen.add(n);
    let segs=n.split(",").map(x=>x.trim());
    if (/^(fish|crustaceans|mollusks|beverages|cereals|spices|game meat|beef|pork|lamb|veal|nuts|seeds)$/.test(segs[0]) && segs.length>1) segs=segs.slice(1);
    let score=n.length/5 + (segs.length-1)*2;
    if (res[0].test(segs[0])) score-=30;
    words.forEach(w=>{ if (segs.slice(0,2).some(x=>x.startsWith(w))) score-=6; });
    if (/\bcooked|roasted|grilled|boiled|brewed|prepared|baked\b/.test(n)) score-=6;
    if (/\braw\b/.test(n)) score-=3;
    if (/meat only|whole|plain|fresh/.test(n)) score-=3;
    if (/sheep|goat|buffalo|human|low sodium|imitation|substitute|\bbran\b|glutinous|dried|unprepared|nuggets|salted/.test(n)) score+=10;
    if (/breaded|battered|nugget|tender|roll\b|fast foods|frozen|canned|dehydrated|powder|flour|with |flavored|sweetened|candies|shake|bar\b|cereal/.test(n)) score+=8;
    hits.push([i,score]);
  }
  return hits.sort((a,b)=>a[1]-b[1]).slice(0,max).map(([i])=>[i,FOODDB[i]]);
}

/* ---------- Train ---------- */

  const t=todayDay(), d=dayBy(S.pick||t.k), gym=d.rest?null:chosenGym(d), ds=deloadStatus();

  <div class="card"><div class="spread"><h2>${esc(d.label)}${d.k!==t.k?` <span class="small muted">moved</span>`:""}</h2><span class="small muted num">${total} sets · ~${Math.round(total*2.6+5)} min</span></div>
    <h3>Target muscles</h3><div class="mus">${Object.entries(mus).map(([m,v])=>`<div><b>${esc(m)}</b><span class="num">${v.ex} exercise${v.ex>1?"s":""} · ${v.sets} sets</span></div>`).join("")}</div></div>

function buildEx(k, n, custom, gym){

}

/* ---------- Charts ---------- */
function multiChart(series, opts){
  const all=series.flatMap(s=>s.pts); if (all.length<2) return "";
  const W=320,H=160,L=40,R=12,T=14,B=24;
  let lo=Math.min(...all.map(p=>p.v)), hi=Math.max(...all.map(p=>p.v)); if (hi-lo<opts.minSpan){ const mm=(hi+lo)/2; lo=mm-opts.minSpan/2; hi=mm+opts.minSpan/2; }
  const t0=Math.min(...all.map(p=>p.t)), t1=Math.max(...all.map(p=>p.t));
  const x=t=>L+(t1===t0?(W-L-R)/2:(t-t0)/(t1-t0)*(W-L-R)), y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const paths=series.map(s=>{ if(!s.pts.length) return ""; const line=s.pts.map((p,i)=>(i?"L":"M")+x(p.t).toFixed(1)+" "+y(p.v).toFixed(1)).join(" "), last=s.pts[s.pts.length-1];
    return `${(s.dots||[]).map(p=>`<circle cx="${x(p.t)}" cy="${y(p.v)}" r="2.4" fill="var(--muted)" fill-opacity=".45"/>`).join("")}${s.pts.length>1?`<path d="${line}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`:""}
      ${s.pts.map(p=>`<circle cx="${x(p.t)}" cy="${y(p.v)}" r="2.6" fill="${s.color}"/>`).join("")}<circle cx="${x(last.t)}" cy="${y(last.v)}" r="4.8" fill="var(--card)" stroke="${s.color}" stroke-width="2.4"/>`; }).join("");
  const mid=(lo+hi)/2;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label)}">
    ${[hi,mid,lo].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${opts.fmt(v)}</text>`).join("")}
    ${paths}<text x="${L}" y="${H-6}">${new Date(t0).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${new Date(t1).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</text></svg>`;
}

/* ---------- Progress ---------- */
function renderProgress(){
  const sg=S.progSeg||"lifts";
  if (sg==="lifts" && S.exView) return renderExercise(S.exView);
  let body="";
  if (sg==="lifts") body=renderLifts();
  else if (sg==="cardio") body=renderCardioHistory();
  else if (sg==="body") body=renderBody();

  return head("Progress")+sampleBanner()+seg("progSeg",[["lifts","Lifts"],["cardio","Cardio"],["body","Body"],["sessions","Sessions"]],sg)+body;
}
function allLifts(){

    const m=map[e.k]||(map[e.k]={k:e.k, def:exDef(e.k,e.custom), gyms:new Set(), n:0, last:null});
    m.gyms.add(s.gym); m.n++; if (!m.last) m.last={ts:s.ts,set:e.sets[0],gym:s.gym};

}

/* ---------- Rest timer ---------- */
const T={end:0,total:0,label:"",beeped:false}; let wake=null, actx=null;
function startRest(sec,label){ T.end=Date.now()+sec*1000; T.total=sec; T.label=label; T.beeped=false; $("#timer").hidden=false; tick(); }
function tick(){
  if (S.active && $("#elapsed")) $("#elapsed").textContent=fmtT((Date.now()-S.active.startedAt)/1000);
  if ($("#timer").hidden) return;
  const left=(T.end-Date.now())/1000;
  $("#timer").classList.toggle("over",left<=0);
  $("#tBig").textContent=left>0?fmtT(left):"+"+fmtT(-left);
  $("#tLab").textContent=left>0?"Next: "+T.label:"Go: "+T.label;
  $("#tBar").style.width=Math.min(100,Math.max(0,(1-left/T.total)*100))+"%";
  if (left<=0&&!T.beeped){ T.beeped=true; try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){} beep(); }
}
function beep(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=880; g.gain.value=.15; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.35);}catch(e){} }
setInterval(tick,250);
async function keepAwake(){ try{ if(navigator.wakeLock&&!wake){ wake=await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>wake=null);} }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.active) keepAwake(); });

let toastT;
function toast(msg, undo){ const t=$("#toast"); t.innerHTML=esc(msg)+(undo?' <button class="tundo">Undo</button>':""); t.hidden=false; clearTimeout(toastT);
  if (undo) t.querySelector(".tundo").onclick=()=>{ undo(); t.hidden=true; render(); };
  toastT=setTimeout(()=>t.hidden=true, undo?6000:2600); }
const NAV_ORDER=["home","food","plan","progress"], SUB={settings:1,habits:1,cardio:1,train:1,energy:1};
let pgT=null;
// Animate the page that was just rendered: children rise in with a short stagger, direction follows the nav.
function pageAnim(kind){
  const m=$("#main"); if(!m) return;
  clearTimeout(pgT); m.classList.remove("pg","pg-r","pg-l","pg-up","pg-soft"); void m.offsetWidth;
  [...m.children].forEach((c,i)=>c.style.setProperty("--i",i));
  m.classList.add("pg","pg-"+kind);
  pgT=setTimeout(()=>m.classList.remove("pg","pg-r","pg-l","pg-up","pg-soft"), 1300);
}
function navKind(from, to){
  if (SUB[to] && !SUB[from]) return "r";
  if (SUB[from] && !SUB[to]) return "l";
  const a=NAV_ORDER.indexOf(from), b=NAV_ORDER.indexOf(to);
  return a<0||b<0||a===b ? "up" : b>a ? "r" : "l";
}
// Hide with an exit animation, then really hide.
function hideAnim(el, ms){ if(!el||el.hidden||el.classList.contains("out")) return; el.classList.add("out"); setTimeout(()=>{ el.hidden=true; el.classList.remove("out"); }, ms||220); }
function setTheme(v){

  const r=document.documentElement; v==="system" ? r.removeAttribute("data-theme") : r.setAttribute("data-theme", v);
  const dark=v==="dark"||(v==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", dark?"#0C0C0E":"#F4F4F2");

/* ---------- Workout actions ---------- */
function logSet(ei, si){
  const ex=S.active.ex[ei], s=ex.sets[si], def=exDef(ex.k,ex.custom);
  if (s.done){ s.done=false; saveActive(); render(); return; }
  const w=s.w!==""?s.w:s.pw, r=s.r!==""?s.r:s.pr;
  if (w===""||r===""||isNaN(+w)||isNaN(+r)){ toast("Enter weight and reps first"); return; }
  s.w=String(+w); s.r=String(+r); s.done=true; S.justTicked=ei+"-"+si; setTimeout(()=>{ if(S.justTicked===ei+"-"+si) S.justTicked=null; },900);
  const nextSet=ex.sets.findIndex(x=>!x.done);
  let label;
  if (nextSet>=0) label=`${def.n}, set ${nextSet+1}`;
  else { const nx=S.active.ex.slice(ei+1).find(x=>x.sets.some(y=>!y.done)); label=nx?exDef(nx.k,nx.custom).n:null; }

/* Label scan: Claude reads the label photo. Barcode: decoded on the phone, matched to foods you've saved. */
async function scanLabel(file){
  if (!sampler || !S.canImages){ toast("Label scanning needs Claude with images allowed"); return; }
  const imgs=Array.isArray(file)?file:[file];
  S.busy="label"; render();
  try{
    const P=`${imgs.length>1?"These are two versions of the same photo of a food product's nutrition panel: the first is contrast-boosted greyscale for legibility, the second is the original colour.":"This is a photo of a food product's nutrition panel."} It may be dim, grainy, at an angle, on a curved or shiny pack, or partly in glare. UK/EU style most likely.
Find the Energy, Fat, Carbohydrate and Protein rows. Prefer the per 100 g (or per 100 ml) column; if only per-serving values are readable, convert to per 100 g using the serving weight.
Use kcal, not kJ (if only kJ is legible, divide by 4.184). Sanity check: kcal should be close to 9×fat + 4×carbs + 4×protein; if a digit is ambiguous, pick the reading that satisfies this.
Do not guess numbers you cannot see. If the key rows are unreadable, set "error" to a short reason such as "too blurry" or "glare over the numbers".
Return only JSON: {"name": product name if visible else a short sensible description, "brand": string or "", "per100": {"kcal": number, "p": protein g, "c": carbohydrate g, "f": fat g}, "serving": {"g": grams per serving or null, "label": e.g. "1 bar" or ""}, "error": ""}.`;
    const ok=r=>r&&!r.error&&r.per100&&+r.per100.kcal>0&&Math.abs(9*(+r.per100.f||0)+4*(+r.per100.c||0)+4*(+r.per100.p||0)-r.per100.kcal)<=Math.max(25,r.per100.kcal*0.2);
    // Fast model first; if its numbers don't add up, re-read with the stronger model.
    // Accuracy first: the stronger model reads every label; if its numbers still don't add up, it gets one more look.
    let res=await sampler.json(P,{images:imgs, modelTier:"default", cache:false});
    if (!ok(res) && !(res&&res.error)){ const r2=await sampler.json(P+"\nYour first reading didn't add up (kcal vs 4P+4C+9F). Re-read each number carefully.",{images:imgs, modelTier:"default", cache:false}).catch(()=>null); if (ok(r2)) res=r2; }
    if (res.error || !res.per100 || isNaN(+res.per100.kcal)) throw {code:"notlabel", msg:res.error};
    const food={schema:SCHEMA, id:uid("food"), name:String(res.name||"Scanned food").slice(0,80), brand:String(res.brand||"").slice(0,60), barcode:S.pendingBarcode||null,
      per100:{kcal:+res.per100.kcal||0, p:+res.per100.p||0, c:+res.per100.c||0, f:+res.per100.f||0},
      serving:res.serving&&+res.serving.g?{g:+res.serving.g, label:String(res.serving.label||"serving")}:null, uses:0, last:Date.now()};
    saveFood(food); S.pendingBarcode=null; S.busy=null; render();
    openFood(food,{src:"label", isNew:true});
  } catch(e){ S.busy=null; render();
    if (e&&e.code==="notlabel"&&window.openScanner){ openScanner("label", "Couldn't read that"+(e.msg?" ("+String(e.msg).toLowerCase().slice(0,40)+")":"")+". Fill the box with the table and hold still."); return; }
    const why=e&&e.code==="notlabel"?("Couldn't read it"+(e.msg?": "+e.msg:"")+". Try again closer up."):e&&e.code==="not_granted"?"Allow Claude to see images to scan labels":"Label reader error: "+(e&&(e.code||e.message)||"unknown")+(e&&e.status?" ("+e.status+")":"");
    toast(why); }
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function decodeBarcode(file){
  try{
    if ("BarcodeDetector" in window){ const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]}); const bm=await createImageBitmap(file); const r=await det.detect(bm); if (r[0]) return r[0].rawValue; }
  }catch(e){}
  try{
    if (!window.ZXing) await loadScript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js");
    const url=URL.createObjectURL(file); const reader=new ZXing.BrowserMultiFormatReader();
    try{ const r=await reader.decodeFromImageUrl(url); return r.getText(); } finally { URL.revokeObjectURL(url); }
  }catch(e){}
  if (sampler && S.canImages){
    try{ const r=await sampler.json('Read the barcode number (the digits printed under the bars) in this photo. Reply only JSON {"digits": "..."} or {"digits": ""} if unreadable.',{images:[file],modelTier:"quick",cache:false}); const d=String(r.digits||"").replace(/\D/g,""); if (d.length>=8) return d; }catch(e){}
  }
  return null;
}
async function scanBarcode(file){
  S.busy="barcode"; render();
  const code=await decodeBarcode(file);
  S.busy=null;
  if (!code){ render(); toast("Couldn't read that barcode. Fill the frame and keep it sharp."); return; }
  const known=S.foods.find(f=>f.barcode===code);
  if (known){ render(); openFood(known); return; }
  const off=window.offLookup&&navigator.onLine?await offLookup(code):null;
  if (off){ render(); openFood(off,{src:"off"}); return; }
  S.pendingBarcode=code; render();
}

const DEFAULT_COND={light:"flattering",pump:"no",time:"am"};
function condText(c){ c={...DEFAULT_COND,...(c||{})}; return `lighting ${c.light==="flattering"?"flattering (overhead or side light that deepens shadows)":c.light==="harsh"?"flat or harsh front light (hides definition)":"neutral, even"}; ${c.pump==="yes"?"pumped, just after training":"not pumped"}; ${c.time==="am"?"morning, fasted":"later in the day, after food and water"}`; }

/* Shrink every photo to a ~1600px JPEG before upload and analysis: faster, smaller, and avoids iPhone formats Claude can't read. */
async function toJpeg(blob, max=1600){
  try{
    const bm=await createImageBitmap(blob);
    const k=Math.min(1, max/Math.max(bm.width,bm.height)), c=document.createElement("canvas");
    c.width=Math.round(bm.width*k); c.height=Math.round(bm.height*k);
    c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||blob),"image/jpeg",0.86));
  }catch(e){ return blob; }
}
function bfPrompt(n, prevSet, cond){
  const kg=currentKg(), p=S.profile;
  return `These are the user's own progress photos from their fitness app. They have asked for an honest body fat estimate to track their physique over time.
Them: ${p.sex||"sex not given"}, ${age()}, ${p.heightCm} cm, ${r1(kg)} kg (7-day average), phase: ${PHASES[p.phase].label}. ${p.sex==="female"?"Use female body fat norms (essential fat ~10-13%; athletic ~14-20%; fit ~21-24%), shifting the male anchors below up by about 8-10 points.":""}
There are ${n} photos. First label each one by what it is mainly for:
- "legs": the legs are uncovered (shorts or underwear, trousers pulled down) or the shot is framed on the lower body. Use this even if the torso is also visible.
- "front": facing the camera with legs covered, torso is the focus.
- "side": body turned roughly 90 degrees, showing the side of the torso.
- "back": back to the camera.
- "other": anything else.
${prevSet&&prevSet.bf?`Previous check-in ${prevSet.date}: ${prevSet.bf.point}% (${prevSet.bf.low}-${prevSet.bf.high}) at ${prevSet.kg} kg. Markers then: ${(prevSet.bf.markers||[]).join("; ")}. Judge change relative to that.`:"This is their first check-in."}
Conditions they reported: ${condText(cond)}. Also judge the lighting yourself from the photos.

Work in two steps.
Step 1, as seen: list the markers you can actually see, then give the body fat these photos show at face value, using these anchors for men (DEXA-referenced, relaxed, neutral light):
- 8-10%: full six-pack relaxed, clear serratus and obliques, vascular lower abs and forearms, visible delt and quad striations.
- 11-13%: upper four abs clear relaxed, lower abs visible mainly when flexed, obliques visible, some arm vascularity, quad separation visible.
- 14-16%: upper abs visible mostly when flexed or in good light, softer lower belly, slight love handles, little vascularity.
- 17-20%: ab outline only in good light, smooth waist, no quad separation.
Step 2, adjusted: correct the face-value number to what a relaxed DEXA-style reading in neutral morning light would say. Visual estimates of lean, flexed lifters usually read low. As a guide add roughly 1-2 points for flattering overhead or side light, 0.5-1 for a pump, 0.5 for later in the day, and about 1 because they always flexes. Use less if the photos themselves show flat light. If the reported conditions and what you see disagree, trust what you see and say so.
Be honest; don't flatter.
Reply with only JSON:
{"poses": [one per photo, in order], "as_seen": number, "point": number (adjusted), "low": number, "high": number, "adjustment": "short reason for the difference, e.g. +1.5 overhead light and flex", "confidence": "low"|"medium"|"high", "markers": [up to 6 short strings], "vs_previous": string, "notes": "max 2 sentences"}`;
}
async function analyse(blobs, prevSet, cond){
  let lim=null; try{ lim=await sampler.limits(); }catch(e){}
  const max=(lim&&lim.images&&lim.images.maxCount)||blobs.length;
  const imgs=[]; for (const b of blobs.slice(0,max)) imgs.push(await toJpeg(b,1400));
  const res=await sampler.json(bfPrompt(imgs.length,prevSet,cond),{images:imgs, modelTier:"complex", cache:false});
  const n=x=>Math.round(+x*10)/10;
  if (!res||isNaN(+res.point)) throw {code:"invalid_json", text:typeof res==="string"?res:""};
  return {point:n(res.point),low:n(res.low),high:n(res.high),confidence:String(res.confidence||""),markers:(res.markers||[]).map(String).slice(0,8),
    vs_previous:String(res.vs_previous||""),notes:String(res.notes||""),asSeen:isNaN(+res.as_seen)?null:n(res.as_seen),adjustment:String(res.adjustment||""),poses:Array.isArray(res.poses)?res.poses.map(x=>POSE_LABEL[String(x).toLowerCase()]?String(x).toLowerCase():"other"):[]};
}
function analyseErr(e){
  const c=(e&&e.code)||"unknown";
  const m={not_granted:"Claude isn't allowed to see images in this app. Turn it on in the app's Permissions menu.",
    images_unavailable:"Image analysis isn't available in this view. Sign in to use it.",
    image_rejected:"One of the photos couldn't be read. Try retaking it.",
    rate_limited:"You've hit a usage limit. Try again in a bit.",
    refused:"Claude declined to estimate from these photos.",
    invalid_json:"Claude replied but not with an estimate. Tap Analyse again.",
    session_expired:"Sign in again, then retry."}[c];
  return (m||"Estimate failed.")+` (${c})`;
}
function applyAnalysis(doc, bf){
  doc.bf={...bf}; delete doc.bf.poses; delete doc.bfError;

async function photoCheckin(){
  const staged=S.staged.slice(); if(!staged.length) return;

    for (const s of staged){ const j=await toJpeg(s.file); blobs.push(j); const up=await assets.upload(j,{type:j.type||"image/jpeg"}); photos.push({id:up.id, pose:""}); }
    doc={schema:SCHEMA,id:uid("p"),ts:Date.now(),date:ymd(new Date()),kg:r1(currentKg()),photos,bf:null,cond:{...DEFAULT_COND,...(S.photoCond||{})}};

      catch(e){ console.warn("analysis",e); doc.bfError=analyseErr(e); toast(doc.bfError); }

async function reanalyse(id){
