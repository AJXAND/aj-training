$("#main").addEventListener("change", e=>{
  if (e.target.dataset.gymname){ const id=e.target.dataset.gymname, v=e.target.value.trim()||"Gym"; S.profile={...S.profile, gyms:gymList().map(g=>g.id===id?{...g,name:v}:g)}; saveProfile(); toast("Saved"); return; }
  const id=e.target.id, v=e.target.value;
  if (id==="pickDay"){ S.pick=v; S.gym=null; render(); }
  else if (id==="pickGym"){ S.gym=v; render(); }
  else if (id==="liveGym"){ const d=dayBy(S.active.dayKey); S.active.gym=v; if (!d.free&&!S.active.label) S.active.ex=(d.variants[v]||[]).map(([k,n,ss])=>({...buildEx(k,n,null,v), ss:ss||null})); saveActive(true); render(); }
  else if (id==="qGym"){ S.qw.gym=v; S.qw.out=null; render(); }
  else if (id==="pastSrc"){ S.past.src=v; }
  else if (id==="pastDate"){ S.past.date=v; }
  else if (id==="wbName"&&S.wb){ S.wb.name=v; }
  else if (id.startsWith("planGym-")){ S.planGym[id.slice(8)]=v; render(); }
  else if (id==="exGym"){ S.exGym=v; render(); }
  else if (id==="pPhase"){ S.profile={...S.profile, phase:v, phaseStart:ymd(new Date())}; saveProfile(); render(); toast(`Phase set to ${PHASES[v].label}`); }
  else if (id==="cType"){ S.cardioForm.type=v; S.cardioForm.level=CARDIO[v].def; S.cardioForm.km=""; S.cardioForm.phoneOn=null; render(); }
  else if (id==="cLevel"){ S.cardioForm.level=v; render(); }
  
  else if ((id==="photoFoodCam"||id==="photoFoodLib")&&e.target.files[0]){ const f=e.target.files[0]; S.photoFood={blob:f, url:URL.createObjectURL(f), note:($("#photoNote")||{}).value||""}; render(); }
  else if ((id==="aiCam"||id==="aiLib")&&e.target.files.length){ S.aiPics=[...(S.aiPics||[]), ...[...e.target.files].slice(0,4).map(f=>({blob:f, url:URL.createObjectURL(f)}))].slice(0,4); render(); }
  else if (id==="labelCam"&&e.target.files[0]){ scanLabel(e.target.files[0]); }
  else if (id==="barcodeCam"&&e.target.files[0]){ scanBarcode(e.target.files[0]); }
  else if ((id==="photoCam"||id==="photoLib")&&e.target.files.length){ stagePhotos(e.target.files); }
});
// Today: tap anywhere on a card (not on one of its buttons) to open the page it's about
const HC_GO={food:["food"], today:["plan"], weight:["progress","body"], week:["plan"], running:["progress","cardio"], strength:["progress","lifts"], habits:["habits"],
  foodweek:["food"], logagain:["food"], burn:["energy"], consistency:["plan"], track:null};
$("#main").addEventListener("click", async e=>{
  const b=e.target.closest("[data-act],[data-goto],[data-segset],[data-hday],[data-back],[data-exview],[data-msel],[data-pcond]");
  if(!b){ const hc=S.tab==="home"&&!e.target.closest("input,select,textarea,a,details,label,.chsc")&&e.target.closest(".hc[data-hc]"); const to=hc&&HC_GO[hc.dataset.hc];
    if (to){ if (hc.dataset.hc==="today"&&S.active) go("train"); else { if (hc.dataset.hc==="week") S.planView="week"; if (hc.dataset.hc==="consistency") S.planView="month"; go(to[0],to[1]); } }
    return; }
  if (b.dataset.pcond){ const sc=b.dataset.pcond, k=b.dataset.k, v=b.dataset.v;
    if (sc==="new") S.photoCond={...DEFAULT_COND,...(S.photoCond||{}),[k]:v};
    else { const ps=S.all.photosets.find(x=>x.id===sc); if(ps){ const d={...ps, cond:{...DEFAULT_COND,...(ps.cond||{}),[k]:v}}; upsert("photosets",d); putDoc("photosets",d.id,d); } }
    render(); return; }
  if (b.dataset.hday!=null){ S.homeDay=+b.dataset.hday; render(); return; }
  if (b.dataset.msel){ S.planSel=b.dataset.msel; render(); return; }
  if (b.dataset.exview){ S.exView=b.dataset.exview; S.exGym="all"; render(); window.scrollTo(0,0); pageAnim("r"); return; }
  if (b.dataset.back==="settings" && S.tab==="settings"){ S.setPage=null; render(); window.scrollTo(0,0); pageAnim("l"); return; }
  if (b.dataset.back==="foodadd"){ S.addTab="search"; go("foodadd"); pageAnim("l"); return; }
  if (b.dataset.back){ const k=b.dataset.back; if (k==="lifts"){ S.exView=null; go("progress","lifts"); } else if (k==="cardio") go("progress","cardio"); else go(k); pageAnim("l"); return; }
  if (b.dataset.goto && !b.dataset.act){ go(b.dataset.goto, b.dataset.seg); return; }
  if (b.dataset.segset){
    const n=b.dataset.segset, v=b.dataset.val;
    if (n==="progSeg"){ S.progSeg=v; S.exView=null; }
    else if (n==="planView") S.planView=v;
    else if (n==="foodMode"){ S.foodMode=v; try{ localStorage.setItem("ajfoodmode",v); }catch(e){} }
    else if (n==="nutMode") { S.profile.nutrition={...(S.profile.nutrition||{}), mode:v}; saveProfile(); }
    else if (n==="theme") setTheme(v);
    else if (n==="restPref") { S.profile={...S.profile, restPref:v}; saveProfile(); }
    else if (n==="pSexSeg") S.profile={...S.profile, sex:v}, saveProfile();
    else if (n==="unitH"||n==="unitW") { if ($("#pName")){ S.profile={...S.profile, name:$("#pName").value.trim()}; } S.profile={...S.profile, units:{...(S.profile.units||{}), [n==="unitH"?"h":"w"]:v}}; saveProfile(); }
    render(); if (["progSeg","planView"].includes(n)) pageAnim("soft"); return;
  }
  const act=b.dataset.act, prev=S.confirm;
  if (!["finish","discard","del","photoDel","slip","hSlip","trkFinish","trkDiscard"].includes(act)) S.confirm=null;
  if (act && act[0]==="h" && act!=="hday" && habitAct(act, b)) return;
  switch(act){
    case "coach": openChat(b.dataset.ctx); return;
    case "buildProg": window.AJOnboard&&AJOnboard.programme(); return;
    case "trackStart": trkStart(b.dataset.t||"run"); return;
    case "track": go("trackpick"); return;
    case "cardioLog": S.cardioForm={type:null, level:"", mins:"", km:"", date:null}; S.cSearch=""; go("cardio"); return;
    case "trkPause": { const tr=S.track; if(!tr) return; if (tr.paused){ tr.pausedMs+=Date.now()-tr.paused; tr.paused=null; } else tr.paused=Date.now(); trkSave(); render(); trkPaint(); return; }
    case "trkFinish": if (S.confirm!=="trkFinish"){ S.confirm="trkFinish"; render(); trkPaint(); setTimeout(()=>{ if(S.confirm==="trkFinish"){ S.confirm=null; if(S.tab==="track"){ render(); trkPaint(); } } },4000); return; } S.confirm=null; trkFinish(); return;
    case "trkDiscard": if (S.confirm!=="trkDiscard"){ S.confirm="trkDiscard"; render(); trkPaint(); setTimeout(()=>{ if(S.confirm==="trkDiscard"){ S.confirm=null; if(S.tab==="track"){ render(); trkPaint(); } } },4000); return; } S.confirm=null; trkStop(); S.track=null; trkSave(); go("home"); toast("Discarded"); return;
    case "logRun": { const t=CARDIO[b.dataset.t]?b.dataset.t:"run"; S.cardioForm={type:t, level:b.dataset.lv||CARDIO[t].def, mins:b.dataset.mins||"", km:b.dataset.km||"", date:null}; go("cardio"); return; }
    case "setUse": { S.profile={...S.profile, modules:modsFor(b.dataset.use)}; saveProfile(); render(); return; }
    case "gymAdd": { const id=uid("g"), list=[...gymList(), {id, name:"New gym", kit:KIT_FULL.slice()}]; S.profile={...S.profile, gyms:list}; saveProfile(); render(); setTimeout(()=>{ const d=[...document.querySelectorAll(".gymrow")].pop(); if(d){ d.open=true; d.scrollIntoView({block:"center"}); } },50); return; }
    case "gymDel": { const g=b.dataset.g; if (S.confirm!=="gymdel-"+g){ S.confirm="gymdel-"+g; render(); return; } S.confirm=null; S.profile={...S.profile, gyms:gymList().filter(x=>x.id!==g)}; saveProfile(); render(); toast("Gym removed. Rebuild your programme to update its sessions."); return; }
    case "gymKit": { const gid=b.dataset.g, k=b.dataset.k; S.profile={...S.profile, gyms:gymList().map(g=>g.id!==gid?g:{...g, kit:(g.kit||[]).includes(k)?g.kit.filter(x=>x!==k):[...(g.kit||[]),k]})}; saveProfile(); const open=[...document.querySelectorAll(".gymrow")].map(d=>d.open); render(); document.querySelectorAll(".gymrow").forEach((d,i)=>d.open=!!open[i]); return; }
    case "hcMove": { const st=hcState(), i=st.order.indexOf(b.dataset.id), j=i+(+b.dataset.d); if (i<0||j<0||j>=st.order.length) return; [st.order[i],st.order[j]]=[st.order[j],st.order[i]]; hcSave(st.order, st.shown); return; }
    case "hcToggle": { const st=hcState(), id=b.dataset.id, sh=st.shown.includes(id)?st.shown.filter(x=>x!==id):[...st.shown,id]; hcSave(st.order, sh); return; }
    case "hcReset": { const pr={...S.profile}; delete pr.homeLayout; S.profile=pr; saveProfile(); render(); toast("Back to the smart order"); return; }
    case "skipHabits": S.profile={...S.profile, skipHabits:true}; saveProfile(); render(); toast("Removed. You can add habits any time from Habits."); return;
    case "nutGoal": window.AJOnboard&&AJOnboard.nutrition(false, b.dataset.step); return;
    case "dayStatus": { const d=b.dataset.d, doc=S.all.foodlog[d]; if (!doc||!(doc.entries||[]).length){ toast("Nothing logged that day"); return; }
      const c=dayCounted(d, priorModel(currentKg()).total); doc.status=c.ok?"partial":"complete"; saveFoodDay(d); render(); toast(c.ok?"Marked partial: left out of expenditure":"Marked complete: counts toward expenditure"); return; }
    case "science": window.AJScience&&AJScience.open(b.dataset.src||null); return;
    case "deload": S.deload=!S.deload; render(); return;
    case "start": { const d=dayBy(S.pick||todayDay().k); startSession(d, chosenGym(d)); return; }
    case "wkGo": S.wkView=b.dataset.v; S.tab="workouts"; go("workouts"); return;
    case "qType": S.qw.type=b.dataset.v; S.qw.out=null; render(); return;
    case "qMus": { const m=b.dataset.v, c=S.qw.muscles; S.qw.muscles=c.includes(m)?c.filter(x=>x!==m):c.concat(m); S.qw.out=null; render(); return; }
    case "qMins": S.qw.mins=+b.dataset.v; S.qw.out=null; render(); return;
    case "qBuild": { const q=S.qw; if (q.type==="custom"&&!q.muscles.length){ toast("Pick at least one muscle"); return; } q.seed=(q.seed||0)+1;
      const r=AJOnboard.quickDay({type:q.type, muscles:q.muscles, mins:q.mins, gymId:q.gym, seed:q.out?String(q.seed):""}); if (!r||!r.list.length){ toast("Couldn't build that with this gym's kit"); return; } q.out=r; render(); return; }
    case "qStart": { const q=S.qw; if (q.out) startWorkout({list:q.out.list, defs:q.out.defs, label:q.out.label, gym:q.gym}); return; }
    case "qSave": { const q=S.qw; if (!q.out) return; S.wb={id:uid("w"), name:q.out.label, coached:true, list:q.out.list.map(x=>x.slice()), defs:JSON.parse(JSON.stringify(wDefsFor(q.out.list,q.out.defs)))}; S.tab="wbuild"; go("wbuild"); return; }
    case "wNew": S.wb={id:uid("w"), name:"", coached:true, list:[], defs:{}}; S.tab="wbuild"; go("wbuild"); return;
    case "wEdit": { const w=(S.profile.workouts||[]).find(x=>x.id===b.dataset.id); if (!w) return; S.wb=JSON.parse(JSON.stringify(w)); S.tab="wbuild"; go("wbuild"); return; }
    case "wStart": { const w=(S.profile.workouts||[]).find(x=>x.id===b.dataset.id); if (w) startWorkout({list:w.list, defs:w.defs, label:w.name, key:"w:"+w.id, coached:w.coached}); return; }
    case "wbCoach": S.wb.coached=!S.wb.coached; render(); return;
    case "wbSets": { const r=S.wb.list[+b.dataset.i]; r[1]=Math.max(1,Math.min(8,r[1]+ +b.dataset.d)); render(); return; }

    case "restCycle": { const e=S.active.ex[+b.dataset.e], cur=restOf(e), nx=REST_STEPS.find(x=>x>cur)||REST_STEPS[0]; e.rest=nx; saveActive(); render(); toast(`Rest ${fmtT(nx)} for this exercise`); return; }
    case "swapOpen": S.swap={ei:+b.dataset.e, reason:null, always:false}; renderSwap(); return;

    case "dropTick": { const dp=S.active.ex[+b.dataset.e].sets[+b.dataset.s].drops[+b.dataset.d]; if(dp.done) dp.done=false; else { if(dp.w===""||dp.r===""){ toast("Enter the drop weight and reps"); return; } dp.done=true; } saveActive(); render(); return; }

      if (prev!=="finish"){ S.confirm="finish"; render(); return; }
      S.confirm=null; const doc=finishSession(); if(!doc){ render(); return; }

  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split("\n"); let out="", inList=false;
  for (const l of lines){

        const kg=+inp.kg; if(!(kg>30&&kg<250)) throw new Error("kg out of range");
        const d=/^\d{4}-\d{2}-\d{2}$/.test(String(inp.date||""))?String(inp.date):ymd(new Date()), prev=(S.all.weights.find(x=>x.d===d)||{}).kg;
        logWeight(kg,d); S.chat.push({role:"action",kind:"weight",title:`Weight · ${r1(kg)} kg`,detail:`7-day average now ${(avgWindow(ymd(new Date()),7)||kg).toFixed(1)} kg`,undo:{kind:"weight",d,prev}});
        renderChat(""); render(); return {ok:true, avg7:avgWindow(ymd(new Date()),7)};
      }}
  ];
  if (S.active) tools.push({name:"swap_exercise", description:"Replace the exercise at an index in today's live session. Logged sets on it are discarded. Only when they asks.",
    inputSchema:{type:"object",properties:{index:{type:"integer"},name:{type:"string"},muscle:{type:"string"},sets:{type:"integer"},rep_low:{type:"integer"},rep_high:{type:"integer"},rest_seconds:{type:"integer"},equipment:{type:"string",enum:["bb","db","cable","machine","bw","other"]}},required:["index","name","sets","rep_low","rep_high"]},
    execute:(inp)=>{
      const i=Number(inp.index), a=S.active; if(!a||!a.ex[i]) throw new Error("No exercise at that index");
      const old=exDef(a.ex[i].k,a.ex[i].custom);
      const custom={n:String(inp.name).slice(0,60),lo:+inp.rep_low||8,hi:+inp.rep_high||12,rest:+inp.rest_seconds||old.rest,eq:String(inp.equipment||"other"),m:String(inp.muscle||old.m)};
      const key="x-"+custom.n.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40);
      a.ex[i]=buildEx(key,Math.max(1,Math.min(8,+inp.sets||3)),custom,a.gym); saveActive(true);
      S.chat.push({role:"action",kind:"swap",title:`Swapped in ${custom.n}`,detail:`Replaces ${old.n} · ${inp.sets}×${custom.lo}–${custom.hi}`});
      renderChat(""); render(); return {ok:true, replaced:old.n, with:custom};
    }});
  return tools;
}
async function sendChat(){
  const inEl=$("#chatIn"), v=inEl.value.trim();
  if ((!v && !chatImg) || !sampler || chatCtl) return;
  inEl.value=""; inEl.style.height="auto"; inEl.placeholder="Tell me what you ate or did…";
  const img=chatImg; chatImg=null;
  S.chat.push({role:"user", content:v||"(photo)", img:img&&img.preview&&img.preview.length<400000?img.preview:null});
  renderChat(""); $("#chatSend").disabled=true;
  const hist=S.chat.slice(-24).map(m=>m.role==="user"?{role:"user",content:m.content}:m.role==="assistant"?{role:"assistant",content:m.content}:m.role==="action"?{role:"assistant",content:`[App: ${m.undone?"undone: ":""}${m.title}. ${m.detail}]`}:null).filter(Boolean);
  while (hist.length && hist[0].role!=="user") hist.shift();
  const turns=[{role:"user",content:chatContext()}, ...hist];
  chatCtl=new AbortController();
  let text="";
  try{
    const opts={cache:false, modelTier:"coach", signal:chatCtl.signal, onText:({text:t})=>{ text=t; const el=$("#streamMsg"); if(el){ el.innerHTML=`<div class="who">${LOGO(18)}AJ Training AI</div>`+mdLite(t); $("#chatMsgs").scrollTop=$("#chatMsgs").scrollHeight; } }};
    if (S.canTools) opts.tools=chatTools();
    if (img && S.canImages) opts.images=[img];
    const res=await sampler(turns, opts);
    const finalText=res.text;
    S.chat.push({role:"assistant", content:finalText.trim()});
  } catch(err){
    if (err && err.text) S.chat.push({role:"assistant",content:err.text});
    if (!err || err.code!=="cancelled") S.chat.push({role:"sys",content: err&&err.code==="not_granted"?"Allow AI for this app to use chat.":err&&err.code==="rate_limited"?"Too many messages. Try again shortly.":"Message failed. Try again."});
  }
  chatCtl=null; $("#chatSend").disabled=false; saveChat(); renderChat();
}

/* ---------- Boot ---------- */
function loadLocal(){
  const obj=k=>Object.values(lsGet(k)||{});
  S.all.sessions=obj("sessions"); S.all.cardio=obj("cardio"); S.all.photosets=obj("photosets"); S.all.foods=obj("foods");
  S.all.foodlog=lsGet("foodlog")||{}; S.all.habits=lsGet("habits")||{}; S.all.weights=lsGet("weights")||[]; S.active=lsGet("active"); S.chat=lsGet("chat")||[];
  const lprof=lsGet("profile"); S.profExisted=!!lprof; S.profile={...DEFAULT_PROFILE,...(lprof||{})}; const lp=lsGet("prog"); if (lp&&lp.days) S.prog=lp; derive();
}
function watch(col, apply, order){
  let q=db.collection(col); if (order) q=q.orderBy(order,"desc").limit(1000);
  q.onSnapshot(snap=>{
    apply(snap.docs.map(d=>({...clone(d.data()), id:d.id}))); derive();
    const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (!typing && $("#chat").hidden && !S.foodAdd) render();
  }, err=>console.warn(col,err));
}
async function boot(){
  $("#chatBrand").innerHTML=LOGO(34)+`<div><b>Coach</b><span>Logs food, cardio, weight and habits</span></div>`;
  $("#chatImgBtn").innerHTML=ICON.image; $("#chatSend").innerHTML=ICON.send;
  render();
  const c=window.claude, use=n=>(c&&c.use)?c.use(n).catch(()=>null):Promise.resolve(null);
  use("permissions").then(p=>p&&p.state().then(st=>{ if(Object.values(st).some(v=>v==="prompt")) return p.request(); })).catch(()=>{});
  const [gotDb,gotAssets,gotSample,gotDl]=await Promise.all([use("db"),use("assets"),use("sample"),use("downloads")]);
  assets=gotAssets; sampler=gotSample; downloads=gotDl;
  if (sampler){ try{ const lim=await sampler.limits(); S.canImages=!!lim.images; S.canTools=!!lim.tools; }catch(e){} }
  if (!gotDb){ loadLocal(); S.ready=true; afterLoad(); render(); splashDone(); return; }
  db=gotDb;
  try{
    const [act,bw,prof,prog,chat]=await Promise.all(["state/active","state/bodyweight","meta/profile","programme/current","state/chat"].map(p=>db.doc(p).get()));
    S.active=act.exists&&act.data().session?clone(act.data().session):lsGet("active");
    S.all.weights=bw.exists?clone(bw.data().entries||[]):[];
    if (prof.exists){ S.profile={...DEFAULT_PROFILE,...clone(prof.data())}; S.profExisted=true; }
    if (prog.exists&&prog.data().days) S.prog=clone(prog.data());
    S.chat=chat.exists?clone(chat.data().messages||[]):[];
  } catch(e){ console.warn(e); S.active=lsGet("active"); }
  derive();
  // profile and weigh-ins changed on another device: apply them, unless a setup flow is open (it previews changes on the profile)
  const quiet=()=>!document.getElementById("ob") && !(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) && $("#chat").hidden && !S.foodAdd;
  db.doc("meta/profile").onSnapshot(s=>{ if (!s.exists || document.getElementById("ob")) return; const d={...DEFAULT_PROFILE,...clone(s.data())}; if (JSON.stringify(d)===JSON.stringify(S.profile)) return; S.profile=d; derive(); if (quiet()) render(); }, ()=>{});
  db.doc("state/bodyweight").onSnapshot(s=>{ const e=s.exists?clone(s.data().entries||[]):[]; if (JSON.stringify(e)===JSON.stringify(S.all.weights)) return; S.all.weights=e; derive(); if (quiet()) render(); }, ()=>{});
  db.doc("state/active").onSnapshot(s=>{ const r=s.exists?(s.data().session||null):null; if (JSON.stringify(r)===JSON.stringify(S.active)) return;
    if (Date.now()-(S._actT||0)<4000) return;   // we just changed it here; our own save will arrive
    const typing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".excard"); S.active=r; lsSet("active", r); if (!typing&&(S.tab==="train"||S.tab==="home"||S.tab==="plan")) render(); }, ()=>{});
  db.doc("programme/current").onSnapshot(s=>{ if(s.exists&&s.data().days){ S.prog=clone(s.data()); if(!S.active&&$("#chat").hidden) render(); } }, ()=>{});
  watch("sessions", l=>S.all.sessions=l, "ts");
  watch("cardio", l=>S.all.cardio=l, "ts");
  watch("photosets", l=>S.all.photosets=l, "ts");
  watch("foods", l=>S.all.foods=l);
  watch("habits", l=>{ const m={}; l.forEach(d=>m[d.date||d.id]=d); S.all.habits=m; });
  watch("foodlog", l=>{ const m={}; l.forEach(d=>m[d.date||d.id]=d); S.all.foodlog=m; });
  S.ready=true; afterLoad(); S.track=trkLoad(); if (S.track){ trkWatchOn(); go("track"); } render(); splashDone();
  if (S.active) keepAwake();
}
/* Accounts created before setup existed keep everything: sections all on, their two gyms, their habits and their plan. */
function migrateLegacy(){
  const p=S.profile; if (p.setupDone || !S.profExisted) return;
  const K=window.AJOnboard?AJOnboard.KIT_DEFAULT:{home:KIT_FULL, shwc:KIT_FULL}, old=p.habits||{};
  p.modules={training:true, endurance:true, nutrition:true, habits:true, body:true};
  if (!p.gyms) p.gyms=[{id:"home", name:"Home gym", kit:K.home},{id:"shwc", name:"Soho House White City", kit:K.shwc}];
  if (!p.sex) p.sex="male";
  if (!p.name){ const em=(window.AJP&&AJP.user&&AJP.user()&&AJP.user().email)||""; p.name=/^smythjonesa@/i.test(em)?"AJ":""; }
  if (p.heightCm===175 && !p.birthSet) p.heightCm=188;
  if (!Array.isArray(p.habitList)){
    const sn={on:true, quitDate:null, perDay:10, canCost:6.5, perCan:20, ...(old.snus||{})}, wk={on:true, target:"07:00", grace:5, ...(old.wake||{})}, st={on:true, target:10000, ...(old.steps||{})};
    p.habitList=[
      {id:"wake", legacy:"wake", type:"time", name:"Up by", target:wk.target, grace:wk.grace, icon:"sun", color:"var(--fat)"},
      {id:"steps", health:true, type:"count", name:"Daily steps", unit:"steps", target:st.target, step:500, icon:"steps", color:"var(--carb)"},
      {id:"snus", legacy:"snus", type:"quit", name:"Quit snus", unit:"pouches", perDay:sn.perDay, cost:sn.canCost/sn.perCan, quitDate:sn.quitDate, icon:"nosnus", color:"var(--prot)"}
    ].filter((h,i)=>[wk.on,st.on,sn.on][i]!==false);
  }
  p.setupDone=true;
  if (S.prog.placeholder){ S.prog=clone(LEGACY_PROGRAMME); if (db) queue("programme/current",()=>db.doc("programme/current").set(S.prog)); else lsSet("prog",S.prog); }
  saveProfile();
}
function afterLoad(){
  try{ if (window.AJOnboard) AJOnboard.addCustom(S.profile.customEx||[]); }catch(e){}
  migrateLegacy();
  if (!S.profile.setupDone) setTimeout(()=>{ if (window.AJOnboard && !S.profile.setupDone) AJOnboard.welcome(); }, 1700);
}
// Launch: hold the splash until data is ready (at least ~1.3 s so the animation lands), then lift it and bring the page in.
let splashGone=false;
function splashDone(){
  if (splashGone) return; splashGone=true;
  const sp=document.getElementById("splash"); if(!sp) return;
  const wait=Math.max(0, 1600-(Date.now()-(window.__splashT||0)));
  setTimeout(()=>{ sp.classList.add("out"); pageAnim("up"); setTimeout(()=>sp.remove(), 600); }, wait);
}
setTimeout(splashDone, 3500);
// onboard.js (AJGoal, AJOnboard) loads after this script. Boot once every script has run, or the first render can use the old phase formula.
if (document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot); else boot();
function routeHash(h){ if (h==="#weigh"||h==="#photos"){ go("progress","body"); setTimeout(()=>{ const el=document.getElementById(h==="#weigh"?"weighin":"photocard"); el&&el.scrollIntoView({block:"start"}); if(h==="#weigh"&&$("#kg")) $("#kg").focus(); },120); } else if (h==="#habits") go("habits"); else if (h==="#food") go("food"); history.replaceState(null,"",location.pathname); }
if (location.hash) setTimeout(()=>routeHash(location.hash),400);
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("message",e=>{ if(e.data&&e.data.type==="open") routeHash(new URL(e.data.url,location.href).hash); });
