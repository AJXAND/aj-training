/* ---------- Shared logging used by the UI and by Claude ---------- */
function makeCardio(type, level, mins, km, date, phoneOn){
  const kg=currentKg(), m=cardioMet(type,level,mins,km), kc=cardioKcal(m.met,mins,kg);
  const doc={schema:SCHEMA,id:uid("c"),ts:date===ymd(new Date())?Date.now():parseD(date).getTime(),date,type,level:m.level,mins,km:km||null,met:m.met,code:m.code,kg:r1(kg),kcal:kc.gross,net:kc.net};
  if (phoneOn!=null) doc.phoneOn=!!phoneOn;
  upsert("cardio",doc); putDoc("cardio",doc.id,doc); return doc;
}
function logWeight(kg, d){ S.all.weights=[...S.all.weights.filter(x=>x.d!==d),{d,kg:r1(kg)}]; saveWeights(); }

function mdLite(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split("\n"); let out="", inList=false;
  for (const l of lines){
    if (/^\s*[-•]\s+/.test(l)){ if(!inList){ out+="<ul>"; inList=true; } out+="<li>"+l.replace(/^\s*[-•]\s+/,"")+"</li>"; }
    else { if(inList){ out+="</ul>"; inList=false; } if (l.trim()) out+="<p>"+l+"</p>"; }
  }
  return out+(inList?"</ul>":"");
}

function recentRecords(){
  const days=[0,1,2].map(i=>ymd(new Date(Date.now()-i*864e5)));
  const lines=[];
  days.forEach(d=>{
    S.cardio.filter(c=>c.date===d).forEach(c=>lines.push(`cardio id=${c.id} ${d} ${CARDIO[c.type]?CARDIO[c.type].n:c.type} ${c.level} ${c.mins}min ${c.net}kcal phone_on=${cardioPhoneOn(c)}`));
    ((S.foodlog[d]||{}).entries||[]).forEach(e=>lines.push(`food id=${e.id} ${d} ${e.name} ${e.amount||""}${e.unit||""} ${e.kcal}kcal`));
    const w=S.weights.find(x=>x.d===d); if (w) lines.push(`weight date=${d} ${w.kg}kg`);
    const h=hday(d); if (h.wake||h.phone!=null||(h.snus&&(h.snus.used||(h.snus.cravings||[]).length))) lines.push(`habits ${d}: wake ${h.wake||"-"}, phone steps ${h.phone??"-"}, total steps ${stepsTotal(d)??"-"}, snus pouches ${(h.snus&&h.snus.used)||0}, cravings ${(h.snus&&(h.snus.cravings||[]).length)||0}`);
  });
  return lines.join("\n")||"none";
}

      execute:(inp)=>{
        const h=habitList().find(x=>x.id===String(inp.habit_id)||x.name.toLowerCase()===String(inp.habit_id).toLowerCase()); if (!h) throw new Error("Unknown habit id");

  if (S.active) tools.push({name:"swap_exercise", description:"Replace the exercise at an index in today's live session. Logged sets on it are discarded. Only when they asks.",
    inputSchema:{type:"object",properties:{index:{type:"integer"},name:{type:"string"},muscle:{type:"string"},sets:{type:"integer"},rep_low:{type:"integer"},rep_high:{type:"integer"},rest_seconds:{type:"integer"},equipment:{type:"string",enum:["bb","db","cable","machine","bw","other"]}},required:["index","name","sets","rep_low","rep_high"]},
    execute:(inp)=>{

      const key="x-"+custom.n.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40);
      a.ex[i]=buildEx(key,Math.max(1,Math.min(8,+inp.sets||3)),custom,a.gym); saveActive(true);
      S.chat.push({role:"action",kind:"swap",title:`Swapped in ${custom.n}`,detail:`Replaces ${old.n} · ${inp.sets}×${custom.lo}–${custom.hi}`});
      renderChat(""); render(); return {ok:true, replaced:old.n, with:custom};

}
async function sendChat(){
  const inEl=$("#chatIn"), v=inEl.value.trim();
  if ((!v && !chatImg) || !sampler || chatCtl) return;
  inEl.value=""; inEl.style.height="auto"; inEl.placeholder="Tell me what you ate or did…";
  const img=chatImg; chatImg=null;
  S.chat.push({role:"user", content:v||"(photo)", img:img&&img.preview&&img.preview.length<400000?img.preview:null});
  renderChat(""); $("#chatSend").disabled=true;
  const hist=S.chat.slice(-24).map(m=>m.role==="user"?{role:"user",content:m.content}:m.role==="assistant"?{role:"assistant",content:m.content}:m.role==="action"?{role:"assistant",content:`[App: ${m.undone?"undone: ":""}${m.title}. ${m.detail}]`}:null).filter(Boolean);
  while (hist.length && hist[0].role!=="user") hist.shift();
  const turns=[{role:"user",content:chatContext()}, ...hist];
  chatCtl=new AbortController();
  let text="";
  try{
    const opts={cache:false, modelTier:"coach", signal:chatCtl.signal, onText:({text:t})=>{ text=t; const el=$("#streamMsg"); if(el){ el.innerHTML=`<div class="who">${LOGO(18)}Claude</div>`+mdLite(t); $("#chatMsgs").scrollTop=$("#chatMsgs").scrollHeight; } }};
    if (S.canTools) opts.tools=chatTools();
    if (img && S.canImages) opts.images=[img];
    const res=await sampler(turns, opts);
    const finalText=res.text;
    S.chat.push({role:"assistant", content:finalText.trim()});
  } catch(err){
    if (err && err.text) S.chat.push({role:"assistant",content:err.text});
    if (!err || err.code!=="cancelled") S.chat.push({role:"sys",content: err&&err.code==="not_granted"?"Allow Claude for this app to use chat.":err&&err.code==="rate_limited"?"Too many messages. Try again shortly.":"Message failed. Try again."});
  }
  chatCtl=null; $("#chatSend").disabled=false; saveChat(); renderChat();
}

/* ---------- Boot ---------- */
function loadLocal(){
  const obj=k=>Object.values(lsGet(k)||{});
  S.all.sessions=obj("sessions"); S.all.cardio=obj("cardio"); S.all.photosets=obj("photosets"); S.all.foods=obj("foods");
  S.all.foodlog=lsGet("foodlog")||{}; S.all.habits=lsGet("habits")||{}; S.all.weights=lsGet("weights")||[]; S.active=lsGet("active"); S.chat=lsGet("chat")||[];
  const lprof=lsGet("profile"); S.profExisted=!!lprof; S.profile={...DEFAULT_PROFILE,...(lprof||{})}; const lp=lsGet("prog"); if (lp&&lp.days) S.prog=lp; derive();
}
function watch(col, apply, order){
  let q=db.collection(col); if (order) q=q.orderBy(order,"desc").limit(1000);
  q.onSnapshot(snap=>{
    apply(snap.docs.map(d=>({...clone(d.data()), id:d.id}))); derive();
    const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (!typing && $("#chat").hidden && !S.foodAdd) render();
  }, err=>console.warn(col,err));
}
async function boot(){
  $("#chatBrand").innerHTML=LOGO(34)+`<div><b>Coach</b><span>Logs food, cardio, weight and habits</span></div>`;
  $("#chatImgBtn").innerHTML=ICON.image; $("#chatSend").innerHTML=ICON.send;
  render();
  const c=window.claude, use=n=>(c&&c.use)?c.use(n).catch(()=>null):Promise.resolve(null);
  use("permissions").then(p=>p&&p.state().then(st=>{ if(Object.values(st).some(v=>v==="prompt")) return p.request(); })).catch(()=>{});
  const [gotDb,gotAssets,gotSample,gotDl]=await Promise.all([use("db"),use("assets"),use("sample"),use("downloads")]);
  assets=gotAssets; sampler=gotSample; downloads=gotDl;
  if (sampler){ try{ const lim=await sampler.limits(); S.canImages=!!lim.images; S.canTools=!!lim.tools; }catch(e){} }
  if (!gotDb){ loadLocal(); S.ready=true; afterLoad(); render(); splashDone(); return; }
  db=gotDb;
  try{
    const [act,bw,prof,prog,chat]=await Promise.all(["state/active","state/bodyweight","meta/profile","programme/current","state/chat"].map(p=>db.doc(p).get()));
    S.active=act.exists&&act.data().session?clone(act.data().session):lsGet("active");
    S.all.weights=bw.exists?clone(bw.data().entries||[]):[];
    if (prof.exists){ S.profile={...DEFAULT_PROFILE,...clone(prof.data())}; S.profExisted=true; }
    if (prog.exists&&prog.data().days) S.prog=clone(prog.data());
    S.chat=chat.exists?clone(chat.data().messages||[]):[];
  } catch(e){ console.warn(e); S.active=lsGet("active"); }
  derive();
  db.doc("programme/current").onSnapshot(s=>{ if(s.exists&&s.data().days){ S.prog=clone(s.data()); if(!S.active&&$("#chat").hidden) render(); } }, ()=>{});
  watch("sessions", l=>S.all.sessions=l, "ts");
  watch("cardio", l=>S.all.cardio=l, "ts");
  watch("photosets", l=>S.all.photosets=l, "ts");
  watch("foods", l=>S.all.foods=l);
  watch("habits", l=>{ const m={}; l.forEach(d=>m[d.date||d.id]=d); S.all.habits=m; });
  watch("foodlog", l=>{ const m={}; l.forEach(d=>m[d.date||d.id]=d); S.all.foodlog=m; });
  S.ready=true; afterLoad(); render(); splashDone();
  if (S.active) keepAwake();
}
/* Accounts created before setup existed keep everything: sections all on, their two gyms, their habits and their plan. */
function migrateLegacy(){
  const p=S.profile; if (p.setupDone || !S.profExisted) return;
  const K=window.AJOnboard?AJOnboard.KIT_DEFAULT:{home:KIT_FULL, shwc:KIT_FULL}, old=p.habits||{};
  p.modules={training:true, endurance:true, nutrition:true, habits:true, body:true};
  if (!p.gyms) p.gyms=[{id:"home", name:"Home gym", kit:K.home},{id:"shwc", name:"Soho House White City", kit:K.shwc}];
  if (!p.sex) p.sex="male";
  if (!p.name){ const em=(window.AJP&&AJP.user&&AJP.user()&&AJP.user().email)||""; p.name=/^smythjonesa@/i.test(em)?"AJ":""; }
  if (p.heightCm===175 && !p.birthSet) p.heightCm=188;
  if (!Array.isArray(p.habitList)){
    const sn={on:true, quitDate:null, perDay:10, canCost:6.5, perCan:20, ...(old.snus||{})}, wk={on:true, target:"07:00", grace:5, ...(old.wake||{})}, st={on:true, target:10000, ...(old.steps||{})};
    p.habitList=[
      {id:"wake", legacy:"wake", type:"time", name:"Up by", target:wk.target, grace:wk.grace, icon:"sun", color:"var(--fat)"},
      {id:"steps", health:true, type:"count", name:"Daily steps", unit:"steps", target:st.target, step:500, icon:"steps", color:"var(--carb)"},
      {id:"snus", legacy:"snus", type:"quit", name:"Quit snus", unit:"pouches", perDay:sn.perDay, cost:sn.canCost/sn.perCan, quitDate:sn.quitDate, icon:"nosnus", color:"var(--prot)"}
    ].filter((h,i)=>[wk.on,st.on,sn.on][i]!==false);
  }
  p.setupDone=true;
  if (S.prog.placeholder){ S.prog=clone(LEGACY_PROGRAMME); if (db) queue("programme/current",()=>db.doc("programme/current").set(S.prog)); else lsSet("prog",S.prog); }
  saveProfile();
}
function afterLoad(){
  migrateLegacy();
  if (!S.profile.setupDone) setTimeout(()=>{ if (window.AJOnboard && !S.profile.setupDone) AJOnboard.welcome(); }, 1700);

// Launch: hold the splash until data is ready (at least ~1.3 s so the animation lands), then lift it and bring the page in.
let splashGone=false;
function splashDone(){
  if (splashGone) return; splashGone=true;
  const sp=document.getElementById("splash"); if(!sp) return;
  const wait=Math.max(0, 1600-(Date.now()-(window.__splashT||0)));
  setTimeout(()=>{ sp.classList.add("out"); pageAnim("up"); setTimeout(()=>sp.remove(), 600); }, wait);
}
setTimeout(splashDone, 3500);
